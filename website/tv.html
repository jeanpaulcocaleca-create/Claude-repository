<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Board · The Hanging Garden</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600&family=Spline+Sans+Mono:wght@400&display=swap">
<style>
:root{
  --bg:#2A1D12; --panel:#33241674; --cream:#F6EFE3; --soft:#D8C9B4;
  --gold:#D8AC5F; --line:#5A4430;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:radial-gradient(120% 90% at 50% 0%,#3A2917 0%,var(--bg) 70%);
  color:var(--cream);font-family:'Figtree',system-ui,sans-serif;overflow:hidden;
  display:flex;flex-direction:column;padding:2.2vh 2.5vw;cursor:none;
}
header{display:flex;align-items:center;justify-content:center;gap:1.6vw;padding-bottom:1.6vh;border-bottom:1px solid var(--line)}
header .cup{width:4.2vh;color:var(--gold)}
header h1{font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:4vh;margin:0;letter-spacing:.02em}
header .sub{font-family:'Spline Sans Mono',monospace;font-size:1.5vh;letter-spacing:.25em;text-transform:uppercase;color:var(--soft)}
main{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:2.5vw;padding-top:2.4vh;min-height:0}
.cat h2{
  font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:2.9vh;margin:0 0 1.6vh;color:var(--gold);
  display:flex;align-items:center;gap:1vw;
}
.cat h2::after{content:"";flex:1;height:1px;background:var(--line)}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:1vw;align-items:center;padding:1.1vh 0}
.it .ph{width:5.4vh;height:5.4vh;border-radius:1vh;object-fit:cover;border:1px solid var(--line)}
.it .noph{width:0;height:5.4vh}
.it .nm{font-size:2.4vh;font-weight:600;line-height:1.25}
.it .ds{font-size:1.6vh;color:var(--soft);line-height:1.3;margin-top:.3vh}
.it .pr{font-family:'Spline Sans Mono',monospace;font-size:2.2vh;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
footer{display:flex;justify-content:space-between;align-items:baseline;padding-top:1.4vh;border-top:1px solid var(--line);font-family:'Spline Sans Mono',monospace;font-size:1.5vh;letter-spacing:.15em;text-transform:uppercase;color:var(--soft)}
.err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--bg);font-size:2.5vh;color:var(--soft);text-align:center;padding:4vw}
@media (orientation:portrait){ main{grid-template-columns:1fr;overflow:hidden} body{cursor:auto} }
</style>
</head>
<body>
<header>
  <svg class="cup" viewBox="0 0 100 80" aria-hidden="true"><path d="M15 20h50v22a18 18 0 01-18 18H33a18 18 0 01-18-18zM65 26h9a9 9 0 010 18h-9" fill="none" stroke="currentColor" stroke-width="7"/><path d="M33 2c-2 5 2 7 0 12M47 2c-2 5 2 7 0 12" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity=".6"/></svg>
  <div>
    <h1>The Hanging Garden</h1>
    <div class="sub">Café · Monteverde · Costa Rica</div>
  </div>
</header>
<main id="board"></main>
<footer>
  <span>Pura vida</span>
  <span id="clock"></span>
</footer>
<div class="err" id="err">The menu board lost its connection.<br>It will keep trying by itself.</div>

<script>
var SUPA_URL = 'https://nbvczarfweanoxvdqplk.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5idmN6YXJmd2Vhbm94dmRxcGxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzcxMDksImV4cCI6MjEwMzc1MzEwOX0._rzaF3tRbzZT9CIDn724O_yKE8zkYENhMDd9zrZYqhU';

function fmt(n){ return '₡' + Number(n).toLocaleString('fr-FR'); }

async function load(){
  try{
    var res = await fetch(SUPA_URL + '/rest/v1/menu_categories?select=name,sort,menu_items(name,description,price_crc,photo_url,available,sort)&order=sort', {
      headers: {apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY}
    });
    if (!res.ok) throw new Error('http ' + res.status);
    var cats = await res.json();
    render(cats);
    document.getElementById('err').style.display = 'none';
  } catch(e){
    if (!document.getElementById('board').children.length)
      document.getElementById('err').style.display = 'flex';
  }
}

function render(cats){
  var board = document.getElementById('board');
  board.textContent = '';
  cats.forEach(function(cat){
    var col = document.createElement('section'); col.className = 'cat';
    var h = document.createElement('h2'); h.textContent = cat.name; col.appendChild(h);
    (cat.menu_items || [])
      .filter(function(it){ return it.available; })
      .sort(function(a,b){ return a.sort - b.sort || a.name.localeCompare(b.name); })
      .forEach(function(it){
        var row = document.createElement('div'); row.className = 'it';
        if (it.photo_url){
          var im = document.createElement('img'); im.className='ph'; im.src = it.photo_url; im.alt='';
          row.appendChild(im);
        } else {
          var sp = document.createElement('span'); sp.className='noph'; row.appendChild(sp);
        }
        var mid = document.createElement('div');
        var nm = document.createElement('div'); nm.className='nm'; nm.textContent = it.name; mid.appendChild(nm);
        if (it.description){ var ds = document.createElement('div'); ds.className='ds'; ds.textContent = it.description; mid.appendChild(ds); }
        row.appendChild(mid);
        var pr = document.createElement('div'); pr.className='pr'; pr.textContent = fmt(it.price_crc);
        row.appendChild(pr);
        col.appendChild(row);
      });
    board.appendChild(col);
  });
}

function tickClock(){
  var d = new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
tickClock(); setInterval(tickClock, 15000);
load(); setInterval(load, 45000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
</script>
</body>
</html>
