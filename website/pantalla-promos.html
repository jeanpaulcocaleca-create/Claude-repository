<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="hg-build" content="__BUILD__">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promociones · Pantalla B · Hanging Garden</title>
<meta name="robots" content="noindex">
<!--
  Canopy OS · SCREEN B: products, brand, invitations and compositions for the guests (docs/PANTALLAS.md,
  migrations 0036 and 0037).
  * Read only: GET rpc/pantalla_datos (this TV's settings, the server time and its slides with the live menu data),
    with the public key, every 30 s. Nothing is written, nobody signs in, nothing is stored on the device.
  * A composition (kind «composicion», 0037) tiles the screen with 1 to 4 zones by its template (1 · 2-lado ·
    3-grande-izq · 3-grande-der · 4-cuadricula · 4-centro); on a turned TV the zones stack vertically in their order.
    Each zone is a presentation of its own: «fija» keeps its one entry; «auto» takes turns among its entries every N s
    with a dissolve between two image layers (the next photo is loaded before the switch; one that fails is skipped;
    nothing ever goes black). The zones' clocks are independent of each other. An entry with a product writes its
    live name (Spanish first, English below) and price when the zone's labels are on, with the price rule of a
    product slide (2 min, then «por confirmar», then no price); an entry whose product cannot be sold is skipped; a
    zone with nothing to show shows its fallback photo or the brand design; a composition with no zone to show is
    not shown. A composition alone in force stays; with other slides it stays dwell_seconds (60 by default).
    A re-read changes prices and availability in place without restarting the presentations.
  * ?preview=1 (the owner's panel, in a frame of the same origin): nothing is read or written; the page draws the
    slide the parent window posts ({tipo: 'pantalla-preview', slide}) and only that.
  * A slide shows only while it is in force by the estimated server time (the server's `now` plus the time elapsed,
    the larger of the monotonic clock and the wall clock for its end, the smaller for its start), on its days and
    hours (Costa Rica, UTC-6 all year). It starts and ends on time with the network down.
  * Product slides carry a price only from a verified read, with its age measured from the moment the read STARTED:
      up to 2 min -> the price; 2 to 10 min -> the price and «Precio por confirmar en caja»;
      older, never, or after a pause/resume until the next read -> no product slide at all.
    Brand and invitation slides keep showing while in force. With nothing in force: the built-in brand slide.
  * Settings: built-in defaults < this TV's row (pantallas.html) < the address, so a technician can still override:
    ?tv=promos-1&pulgadas=55&distancia=3&giro=no|derecha|izquierda&escala=100&look=auto|dia|noche&diapositiva=10&diag=1
    Capitals: titles 1.2 cm per metre of reading distance (a long title down to 1.0, then it wraps), prices 1.5,
    other text 0.8. A QR code is at least a tenth of the distance wide.
    giro=derecha turns the picture right, for a TV whose top edge ended up on the LEFT (like tv.html).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Figtree:wght@500;600;700;800&display=swap">
<style>
:root{
  --bg:#0F2418; --deep:#0A1A10; --cream:#F6F1E2; --soft:#C9D3BC; --gold:#DBB365; --leaf:#7FA381; --kick:#A9C9A4;
  --warn:#F2C14E; --warn-ink:#1B1405; --qr-ink:#0B1A10;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--deep);overflow:hidden;cursor:none}
.hg-lang{display:none !important}   /* no language switch: the screen shows both languages at once */

/* the stage is sized and turned in pixels by orientar(), from the real window (like tv.html) */
#stage{position:absolute;top:0;left:0;overflow:hidden;transform-origin:0 0;background:var(--deep);color:var(--cream);
  font-family:'Figtree',system-ui,sans-serif}
/* outside the TV's hours: a black screen, nothing on it (the technician's box only with diag=1) */
body.apagado,#stage.apagado{background:#000}
#stage.apagado > :not(#diag){display:none !important}

/* two layers: the next slide is built and fitted in the hidden one, then they crossfade */
.capa{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 0s linear 1s}
.capa.on{opacity:1;visibility:visible;transition:opacity 1s ease}
.capa.ya,.capa.ya.on{transition:none}          /* a slide that must go (ended, sold out) is replaced at once */

.sl{position:absolute;inset:0;overflow:hidden;--g:16px}
/* the brand background: no image, so it works without internet */
.fondo{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#1A3A26 0%,var(--bg) 70%)}
.fondo .niebla{position:absolute;inset:-20%;background:
  radial-gradient(45% 30% at 20% 30%,rgba(214,228,214,.10),transparent 70%),
  radial-gradient(50% 32% at 80% 60%,rgba(214,228,214,.08),transparent 70%),
  radial-gradient(40% 26% at 55% 15%,rgba(214,228,214,.07),transparent 70%);
  animation:drift 46s ease-in-out infinite alternate}
.fondo .hojaG{position:absolute;right:-8%;top:-14%;width:58%;height:auto;color:var(--leaf);opacity:.08}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,1.5%,0) scale(1.06)}}
/* a full-bleed photo; while it loads (or if it fails) the brand background shows */
.foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s ease}
.foto.ok{opacity:1;animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.1)}}
.velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,26,16,.5) 0%,rgba(10,26,16,0) 20%,
  rgba(10,26,16,.28) 40%,rgba(10,26,16,.84) 66%,rgba(10,26,16,.95) 100%)}

.sup{position:absolute;display:flex;align-items:center;gap:.45em;font-family:'Playfair Display',Georgia,serif;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--gold);white-space:nowrap;line-height:1.2;
  text-shadow:0 2px 14px rgba(8,16,10,.7)}
.sup svg{width:1.1em;height:1.1em;flex:none}
.caja{position:absolute;display:flex;flex-direction:column}
.txt{margin-top:auto;position:relative;text-shadow:0 2px 18px rgba(8,16,10,.8)}
.confoto .txt::before{content:"";position:absolute;inset:calc(var(--g) * -1.2) calc(var(--g) * -1.6);z-index:-1;pointer-events:none;
  border-radius:calc(var(--g) * 1.5);background:rgba(8,16,10,.5);filter:blur(calc(var(--g) * 1.4))}
.claro .txt{margin:auto 0;text-align:center}

.kick{font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--kick);line-height:1.2;margin-bottom:.5em}
.kick .en{color:var(--soft)}
.tit{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.08;margin:0;color:var(--cream);text-wrap:balance}
.tit-en{font-weight:600;color:var(--soft);line-height:1.15;margin-top:.2em}
.cuerpo{font-weight:600;line-height:1.25;margin-top:.7em;color:var(--cream)}
.cuerpo-en{font-weight:500;line-height:1.25;margin-top:.2em;color:var(--soft)}
.precio{font-weight:800;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:.22em}
.precio .cur{font-size:.8em;margin-right:.05em}
.nota{width:fit-content;max-width:100%;background:var(--warn);color:var(--warn-ink);font-weight:800;line-height:1.2;
  border-radius:.3em;padding:.12em .45em;margin-top:.35em;text-shadow:none}
.pida{font-weight:700;color:var(--soft);line-height:1.2;margin-top:.55em}
.claro .nota{margin-left:auto;margin-right:auto}

/* the built-in brand slide */
.k-propia .hojaM{display:block;margin:0 auto calc(var(--g) * .6);color:var(--gold)}
.k-propia .tit{color:var(--gold);letter-spacing:.02em}
.k-propia .linea{width:22%;height:2px;margin:calc(var(--g) * .9) auto;background:var(--gold);opacity:.55}
.k-propia .lugar{font-weight:600;color:var(--soft);letter-spacing:.06em;line-height:1.2}

/* invitations: the text and the QR code side by side (one above the other on a vertical TV) */
.fila{margin:auto 0;display:flex;align-items:center;gap:calc(var(--g) * 2.2)}
.fila .txt{margin:0;flex:1 1 0;min-width:0;text-align:left}
.vertical .fila{flex-direction:column;align-items:stretch}
.vertical .fila .txt{flex:none;text-align:center}
.qrcol{flex:none;display:flex;flex-direction:column;align-items:center;align-self:center}
.qrcard{background:#fff;border-radius:6px;line-height:0;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.qrcard svg{display:block}
.dir{font-weight:700;color:var(--cream);white-space:nowrap;line-height:1.2;text-align:center;text-shadow:0 2px 12px rgba(8,16,10,.7)}
.qrcard + .dir{margin-top:.45em}
.dirsola{font-weight:800;color:var(--gold);white-space:nowrap;line-height:1.2;text-align:center}

/* daylight look: slides without a photo turn bright (a dark screen mirrors the window); photos keep their dark veil */
#stage.dia .claro{--cream:#0F2618;--soft:#2F3F33;--gold:#7A4A00;--kick:#2F6B3A;--leaf:#2F6B3A}
#stage.dia .claro .fondo{background:#FFFBF1}
#stage.dia .claro .niebla{display:none}
#stage.dia .claro .hojaG{color:#7FA381;opacity:.1}
#stage.dia .claro .txt,#stage.dia .claro .sup,#stage.dia .claro .dir{text-shadow:none}
#stage.dia .claro .qrcard{box-shadow:0 0 0 2px #C9A253}

/* a composition: zones that tile the stage (positioned in px by ajustarComposicion), each with two image layers that
   dissolve into each other: the new one fades in OVER the old one, which stays opaque until the fade ends, so the
   zone is never darker than a photo in between */
.k-composicion .zonas{position:absolute;inset:0}
.zona{position:absolute;overflow:hidden;background:var(--bg)}
.zcapa{position:absolute;inset:0;opacity:0;z-index:1;transition:opacity var(--fundido,1s) ease}
.zcapa.on{opacity:1}
.zcapa.entra{z-index:2}
.zcapa.ya{transition:none}
.zcapa.sale .ztxt{opacity:0;transition-duration:.3s}
.zfoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* the veil under the labels: dark from about half the zone, so even the first line of a long name reads over a light photo */
.zvelo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,26,16,0) 22%,rgba(10,26,16,.55) 52%,rgba(10,26,16,.9) 100%)}
.ztxt{position:absolute;left:var(--zp);right:var(--zp);bottom:var(--zp);text-shadow:0 2px 14px rgba(8,16,10,.8);
  transition:opacity var(--fundido,1s) ease}
.ztit{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.08;margin:0;color:var(--cream);text-wrap:balance}
.ztit-en{font-weight:600;color:var(--soft);line-height:1.15;margin-top:.15em}
.zsinen .ztit-en{display:none}   /* a layer whose name, English and price do not fit: the English goes first (ajustarZona) */
.zprecio{font-weight:800;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:.18em}
.zprecio .cur{font-size:.8em;margin-right:.05em}
.znota{width:fit-content;max-width:100%;background:var(--warn);color:var(--warn-ink);font-weight:800;line-height:1.2;
  border-radius:.3em;padding:.1em .4em;margin-top:.3em;text-shadow:none}
/* a zone with nothing to show and no fallback photo: the brand design, in the zone */
.zmarca{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:var(--zp);text-shadow:0 2px 14px rgba(8,16,10,.6)}
.zmarca .hojaM{display:block;margin:0 auto calc(var(--zp) * .4);color:var(--gold)}
.zmarca .zmnombre{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.08;color:var(--gold);letter-spacing:.02em;text-wrap:balance}
.zmarca .linea{width:22%;height:2px;margin:calc(var(--zp) * .5) auto;background:var(--gold);opacity:.55}
.zmarca .lugar{font-weight:600;color:var(--soft);letter-spacing:.06em;line-height:1.2}
/* the kicker of a composition: a line in the top right corner, over the zones */
.zkick{position:absolute;z-index:3;background:rgba(8,16,10,.55);border-radius:99px;padding:.3em .9em;margin:0;text-shadow:0 1px 8px rgba(8,16,10,.6)}
.k-composicion .sup{z-index:3}
#stage.dia .zclara{--cream:#0F2618;--soft:#2F3F33;--gold:#7A4A00;--leaf:#2F6B3A}
#stage.dia .zclara .fondo{background:#FFFBF1}
#stage.dia .zclara .niebla{display:none}
#stage.dia .zclara .hojaG{color:#7FA381;opacity:.1}
#stage.dia .zclara .zmarca{text-shadow:none}

#diag{position:absolute;right:1%;bottom:1%;z-index:6;max-width:52%;background:rgba(0,0,0,.84);color:#fff;border-radius:8px;
  font:500 14px/1.35 'Figtree',system-ui,sans-serif;padding:.6em .9em;white-space:pre-wrap}
#diag b{color:#F2C14E}
#fsHint{position:absolute;left:50%;top:2%;transform:translateX(-50%);z-index:5;background:rgba(10,26,16,.9);color:#F6F1E2;
  font:700 16px/1.3 'Figtree',system-ui,sans-serif;padding:.5em 1.2em;border-radius:99px;max-width:92%;text-align:center;
  opacity:0;transition:opacity .6s;pointer-events:none}
#fsHint.on{opacity:1}
@media (prefers-reduced-motion:reduce){.capa,.capa.on,.foto,.zcapa,.ztxt{transition:none}.foto.ok,.fondo .niebla{animation:none}}
</style>
</head>
<body>
<div id="stage" data-no-translate>
  <div class="capa" id="capaA"></div>
  <div class="capa" id="capaB"></div>
  <div id="diag" hidden></div>
  <div id="fsHint">Pulse OK en el control para pantalla completa · Press OK for full screen</div>
</div>

<script src="config.js"></script>
<script src="lang.js"></script>
<script>
/* the screen updates itself after a release (version.js), without a notice to the guests, at any moment (not the
   owner's preview frame, which would lose the slide it was sent) */
window.HG_VERSION_NOTICE = function () {};
window.HG_SAFE_TO_RELOAD = function () { return !/(^|[?&])preview=1(&|$)/.test(location.search); };
</script>
<script src="version.js" defer></script>
<script>
(function () {
  'use strict';
  var CFG = window.HG_CONFIG || {};
  /* times in ms; only the tests shorten them (window.PANTALLA_TEST). zona: ms per declared second of a zone's
     presentation; fundido: the dissolve between a zone's photos; permanencia: how long a composition stays when it
     shares the TV (0 = its own dwell_seconds, 60 s by default) */
  var T = { fresco: 2 * 60000, vencido: 10 * 60000, cada: 30000, revisar: 1000, limite: 12000, reintento: 60000, diapositiva: 0, zona: 1000, fundido: 1000, permanencia: 0 };
  try {
    var over = window.PANTALLA_TEST || {};
    Object.keys(over).forEach(function (k) { if (k in T && Number(over[k]) > 0) T[k] = Number(over[k]); });
  } catch (e) {}
  var TICK = Math.min(T.cada, T.revisar);
  /* a pause longer than 3 ticks in either clock (sleep, frozen tab, clock moved): prices unverified until a read.
     Never under 3 s, so a busy device with test timings does not count as asleep */
  var SALTO = Math.max(3 * TICK, 3000);
  var H6 = 6 * 3600000;                                /* Costa Rica: UTC-6 all year */
  /* the invitations' destinations (fixed here, never typed by anyone): the review page approved by the owner (E-35)
     and the QR menu; the short address is written under the code */
  var ENLACES = {
    resena: { url: 'https://www.tripadvisor.com/UserReview-g951347-d34058072-The_hanging_garden_cafe-Monteverde_Province_of_Puntarenas.html',
              dir: ['tripadvisor.com', 'Hanging Garden Café'] },
    menu: { url: 'https://hanginggardencafe.com/m', dir: ['hanginggardencafe.com/m'] }
  };
  var QR_JS = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
  var LEAF = 'M17.6 3.3C9.5 3.6 4.6 9 4.4 15.9c0 1.8.4 3.4 1.2 4.8.5-4 2.3-8.1 5.9-11-2.7 3.5-4.2 7.8-4.3 11.6.7.3 1.5.4 2.3.4 3 0 5.6-1.2 7.4-3.3 2.6-3.1 3-9.6.7-15.1z';
  var MARCA = { id: 'marca', kind: 'propia' };         /* the built-in brand slide */
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), capas = [$('capaA'), $('capaB')];
  stage.style.setProperty('--fundido', T.fundido + 'ms');
  /* the templates of a composition: each zone's place as fractions of the stage [x, y, w, h], in the order the zones
     are listed (left to right; a column of stacked zones top to bottom; the 2 x 2 grid row by row). A zone whose area
     is a third of the stage or more is «large» (bigger letters) */
  var PLANTILLAS = {
    '1': [[0, 0, 1, 1]],
    '2-lado': [[0, 0, 0.5, 1], [0.5, 0, 0.5, 1]],
    '3-grande-izq': [[0, 0, 2 / 3, 1], [2 / 3, 0, 1 / 3, 0.5], [2 / 3, 0.5, 1 / 3, 0.5]],
    '3-grande-der': [[0, 0, 1 / 3, 0.5], [0, 0.5, 1 / 3, 0.5], [1 / 3, 0, 2 / 3, 1]],
    '4-cuadricula': [[0, 0, 0.5, 0.5], [0.5, 0, 0.5, 0.5], [0, 0.5, 0.5, 0.5], [0.5, 0.5, 0.5, 0.5]],
    '4-centro': [[0, 0, 3 / 8, 1], [3 / 8, 0, 2 / 8, 0.5], [3 / 8, 0.5, 2 / 8, 0.5], [5 / 8, 0, 3 / 8, 1]]
  };
  var PERMANENCIA = 60000;                              /* a composition sharing the TV: 60 s unless it says otherwise */

  /* ---------- the address ---------- */
  var Q = (function () {
    var o = {};
    String(location.search).replace(/^\?/, '').split('&').forEach(function (kv) {
      if (!kv) return; var i = kv.indexOf('='), k = i < 0 ? kv : kv.slice(0, i), v = i < 0 ? '' : kv.slice(i + 1);
      try { o[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' ')); } catch (e) {}
    });
    return o;
  })();
  var malos = [];                                    /* address values not valid (named in the diagnosis) */
  var LIM = { pulgadas: [24, 110, 'inches'], distancia: [1, 15, 'distance_m'], escala: [70, 160, 'scale_pct'], diapositiva: [6, 30, 'slide_seconds'] };
  var DEF = { pulgadas: 55, distancia: 3, escala: 100, diapositiva: 10, giro: 'no', look: 'auto' };
  var OPC = { giro: [/^(no|derecha|izquierda)$/, 'turn'], look: [/^(auto|dia|noche)$/, 'look'] };
  var DIR = {};                                      /* the valid values the address gives */
  Object.keys(LIM).forEach(function (k) {
    if (Q[k] === undefined || Q[k] === '') return;
    var n = Number(String(Q[k]).replace(',', '.'));
    if (isFinite(n) && n >= LIM[k][0] && n <= LIM[k][1]) DIR[k] = n; else malos.push(k + '=' + Q[k]);
  });
  Object.keys(OPC).forEach(function (k) {
    if (Q[k] === undefined || Q[k] === '') return;
    if (OPC[k][0].test(Q[k])) DIR[k] = Q[k]; else malos.push(k + '=' + Q[k]);
  });
  var TV = String(Q.tv || '').trim().toLowerCase().slice(0, 40);
  var TV_OK = /^[a-z0-9][a-z0-9-]{1,29}$/.test(TV);
  if (TV && !TV_OK) malos.push('tv=' + Q.tv);
  /* the owner's preview (pantallas.html frames this page): no read, no write; it draws what the parent posts */
  var PREVIEW = Q.preview === '1', previa = null;

  /* ---------- this TV's settings: defaults < its row in the database < the address ---------- */
  var fila = null;                                   /* the TV's row of the last read (memory only) */
  var razon = PREVIEW ? 'vista-previa' : !TV ? 'sin-tv' : !TV_OK ? 'tv-no-valida' : 'sin-lectura';
  var AJ = null, origen = {}, malosBase = [], diapoMs = 10000;
  function hm(s) {
    var m = /^([01]\d|2[0-3]):([0-5]\d)/.exec(String(s || ''));
    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
  }
  function hhmm(m) { return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2); }
  function calcularAjustes() {
    var f = fila, aj = { tv: TV || String(Q.tv || '').slice(0, 40), diag: Q.diag === '1' }, o = {};
    malosBase = [];
    Object.keys(LIM).forEach(function (k) {
      var L = LIM[k], v = DEF[k], de = 'omision';
      if (f && f[L[2]] != null) {
        var n = Number(f[L[2]]);
        if (isFinite(n) && n >= L[0] && n <= L[1]) { v = n; de = 'db'; } else malosBase.push(L[2] + '=' + f[L[2]]);
      }
      if (k in DIR) { v = DIR[k]; de = 'direccion'; }
      aj[k] = v; o[k] = de;
    });
    Object.keys(OPC).forEach(function (k) {
      var v = DEF[k], de = 'omision', b = f ? f[OPC[k][1]] : null;
      if (b != null) { if (OPC[k][0].test(String(b))) { v = String(b); de = 'db'; } else malosBase.push(OPC[k][1] + '=' + b); }
      if (k in DIR) { v = DIR[k]; de = 'direccion'; }
      aj[k] = v; o[k] = de;
    });
    var a = f ? hm(f.on_from) : null, b = f ? hm(f.on_to) : null;
    aj.desde = a !== null && b !== null && a !== b ? a : null;
    aj.hasta = aj.desde !== null ? b : null;
    aj.supuesto = o.pulgadas === 'omision' || o.distancia === 'omision';
    AJ = aj; origen = o;
    diapoMs = T.diapositiva || AJ.diapositiva * 1000;
  }
  function fijarFila(f, por) {
    var giro = AJ && AJ.giro;
    fila = f; razon = f ? null : por;
    calcularAjustes();
    if (giro !== AJ.giro) orientar();
  }
  function fuente() { return fila ? 'db' : Object.keys(DIR).length ? 'direccion' : 'omision'; }

  /* ---------- the server's time, estimated between reads ---------- */
  /* hi: counted from the request's start, with the larger elapsed of both clocks (never behind: ends are never late);
     lo: counted from the answer's arrival, with the smaller (never ahead: starts are never early) */
  var srv = null;
  function estimar() {
    var p = performance.now(), r = Date.now();

        e.style.fontSize = ((f[r] || 0.8) * base * z.k * pxCm / proporcion(e)) + 'px';
      }
      var hj = zn.querySelector('.hojaM'), zm = zn.querySelector('[data-r="zm"]');
      if (hj && zm) hj.style.width = hj.style.height = (parseFloat(zm.style.fontSize) * 0.9) + 'px';
    }
    function cabe() {
      var ts = zn.querySelectorAll('.ztxt, .zmarca');
      for (var i = 0; i < ts.length; i++) {
        var t = ts[i], tope = t.classList.contains('ztxt') ? 0.5 * zh : zh;
        if (t.scrollHeight > tope + 1) return false;
      }
      var ns = zn.querySelectorAll('[data-r]');
      for (var j = 0; j < ns.length; j++) if (ns[j].getClientRects().length && ns[j].scrollWidth > ns[j].clientWidth + 1) return false;
      return true;
    }
    zn.classList.remove('zsinen');
    z.k = 1; aplicar();
    if (!cabe() && zn.querySelector('.ztit-en')) zn.classList.add('zsinen');   /* this layer's English, not the zone's: a short name keeps it */
    if (!cabe()) { z.k = mayor(0.35, 1, function (v) { z.k = v; aplicar(); return cabe(); }); aplicar(); }
    z.cabe = cabe();
  }
  /* the front layer of the zone writes a name whose English it had to hide (no room at the distance's letter) */
  function sinIngles(z) { var c = z.capas[z.frente]; return c.classList.contains('zsinen') && !!c.querySelector('.ztit-en'); }
  /* the zones of the composition on screen, for the diagnosis and the tests */
  function estadoZonas() {
    if (!actual || actual.kind !== 'composicion') return null;
    var sl = capas[frente].querySelector('.sl.k-composicion'), zn = sl ? sl.querySelectorAll('.zona') : [], out = [];
    for (var i = 0; i < zn.length; i++) {
      var z = zn[i]._z, e = z.estado === 'entrada' && z.idx >= 0 ? z.entradas[z.idx] : null;
      out.push({ modo: z.modo, seg: z.seg, labels: z.labels, estado: z.estado, entrada: z.idx, entradas: z.entradas.length, mostrables: mostrables(z),
                 grande: z.grande, k: z.k, cabe: z.cabe, sinIngles: sinIngles(z), titulo: e ? e.tit : '', precio: e ? e.precio : null, cambiando: z.cambiando, reloj: !!z.timer });
    }
    return { plantilla: actual.plantilla, permanenciaMs: tiempoDe(actual), zonas: out };
  }

  /* ---------- fitting: the sizes for the distance; a long title smaller (never under 1.0 cm/m) then wrapped;
     never anything outside the screen (the last resort makes everything smaller, and the diagnosis says so) ---------- */
  var medidas = {};
  function ajustar(sl, vm) {
    var pxCm = Math.max(anchoE, altoE) / largoCm(), base = AJ.distancia * AJ.escala / 100;
    var padX = Math.round(0.055 * anchoE), padY = Math.round(0.055 * altoE), vertical = altoE > anchoE;
    var caja = sl.querySelector('.caja'), sup = sl.querySelector('.sup'), tit = sl.querySelector('.tit');
    var col = sl.querySelector('.qrcol'), svg = col && col.querySelector('svg'), n = col ? Number(col.getAttribute('data-modulos')) || 0 : 0;
    var ideal = vm.kind === 'propia' ? 1.6 : 1.2;
    var st = { t: ideal, wrap: false, k: 1, qr: 0, qrMax: 0, mod: 0 };
    var qrMin = AJ.distancia * 10 * pxCm;          /* the code's side: a tenth of the reading distance */
    function aplicar() {
      var ns = sl.querySelectorAll('[data-r]');
      for (var i = 0; i < ns.length; i++) {
        var e = ns[i], r = e.getAttribute('data-r');
        var f = r === 't' ? st.t : r === 'te' ? Math.max(0.75 * st.t, FACT.k) : FACT[r];
        e.style.fontSize = (f * base * st.k * pxCm / proporcion(e)) + 'px';
      }
      if (tit) tit.style.whiteSpace = st.wrap ? 'normal' : 'nowrap';
      var g = FACT.k * base * st.k * pxCm;
      sl.style.setProperty('--g', g + 'px');
      var top = padY;
      if (sup) {   /* the brand on top is decoration: it goes when it does not fit */
        sup.style.display = ''; sup.style.left = padX + 'px'; sup.style.top = padY + 'px';
        if (sup.scrollWidth > anchoE - 2 * padX + 1) sup.style.display = 'none'; else top = padY + sup.offsetHeight + g;
      }
      caja.style.left = padX + 'px'; caja.style.right = padX + 'px'; caja.style.top = top + 'px'; caja.style.bottom = padY + 'px';
      if (svg) {
        var mod = Math.max(1, Math.floor(st.qr * st.k / n));
        if (mod * n < qrMin * st.k && (mod + 1) * n <= st.qrMax * st.k) mod++;
        st.mod = mod; svg.style.width = svg.style.height = mod * (n + 8) + 'px';
      }
      var hj = sl.querySelector('.hojaM');
      if (hj && tit) { var tf = parseFloat(tit.style.fontSize) * 0.9; hj.style.width = hj.style.height = tf + 'px'; }
    }
    function cabe() {
      var hijo = caja.firstElementChild;
      /* layout boxes only: the blurred backdrop behind a text (a pseudo-element past its edges) is not text */
      if (hijo.offsetHeight > caja.clientHeight + 1 || hijo.offsetWidth > caja.clientWidth + 1) return false;
      var ns = sl.querySelectorAll('[data-r]');
      for (var i = 0; i < ns.length; i++) if (ns[i].getClientRects().length && ns[i].scrollWidth > ns[i].clientWidth + 1) return false;
      if (col && (col.offsetWidth > caja.clientWidth + 1)) return false;
      if (col && !vertical) { var tx = sl.querySelector('.fila > .txt'); if (tx && tx.clientWidth < 0.3 * caja.clientWidth) return false; }
      return true;
    }
    function largo() { return !st.wrap && tit && tit.scrollWidth > tit.clientWidth + 1; }
    if (svg && n) {   /* the code first: as big as the distance asks (and a little more when there is room) */
      st.qr = qrMin; st.qrMax = qrMin; aplicar();
      var dirH = col.offsetHeight - svg.parentNode.offsetHeight, tot = (n + 8) / n, H = caja.clientHeight, W = caja.clientWidth;
      st.qrMax = vertical ? Math.min(W / tot, (0.62 * H - dirH) / tot) : Math.min((H - dirH) / tot, 0.5 * W / tot);
      st.qr = Math.max(n, Math.min(1.2 * qrMin, st.qrMax));
    }
    aplicar();
    if (!cabe()) {
      if (largo()) {
        st.t = TIT_MIN; aplicar();
        if (!largo()) { st.t = mayor(TIT_MIN, ideal, function (v) { st.t = v; aplicar(); return !largo(); }); aplicar(); }
        else { st.wrap = true; st.t = ideal; aplicar(); }      /* too long even at 1.0: it wraps, at its normal size */
      }
      if (!cabe()) {
        var tope = st.t; st.t = TIT_MIN; aplicar();
        if (cabe()) { st.t = mayor(TIT_MIN, tope, function (v) { st.t = v; aplicar(); return cabe(); }); aplicar(); }
        else {
          if (!st.wrap) { st.wrap = true; aplicar(); }
          if (!cabe()) { st.k = mayor(0.2, 1, function (v) { st.k = v; aplicar(); return cabe(); }); aplicar(); }
        }
      }
    }
    medidas = { pxPorCm: pxCm, base: base, titulo: st.t * st.k, k: st.k, envuelto: st.wrap, cabe: cabe(),
                qrCm: svg ? st.mod * n / pxCm : null, qrMinCm: svg ? AJ.distancia * 10 : null, qrModulos: n || null };
    medidas.qrPequeno = !!svg && medidas.qrCm < medidas.qrMinCm - 0.05;
  }

  /* ---------- what is on screen ---------- */
  var frente = 0, actual = null, actualFirma = '', desde = 0, visibles = [], apagado = false, limpiarT = null;
  var fijo = false;                  /* shown by hand (PANTALLA_B.mostrar): even the brand slide keeps its full time */
  function buscar(lista, id) { for (var i = 0; i < lista.length; i++) if (lista[i].id === id) return lista[i]; return null; }
  function siguiente(cur, lista) {
    for (var i = 0; i < lista.length; i++) if (cmp(lista[i], cur) > 0) return lista[i];
    return lista[0] || null;
  }
  function poner(s, modo) {
    var vm = modelo(s, estado()), sale = capas[frente], entra = capas[1 - frente];
    recordarZonas(sale);
    construir(entra, vm, null);
    var corte = modo === 'corte';
    if (corte) { entra.classList.add('ya'); sale.classList.add('ya'); }
    entra.classList.add('on'); sale.classList.remove('on');
    if (corte) requestAnimationFrame(function () { requestAnimationFrame(function () { entra.classList.remove('ya'); sale.classList.remove('ya'); }); });
    frente = 1 - frente; actual = s; actualFirma = firmaDe(vm); desde = performance.now(); fijo = false;
    clearTimeout(limpiarT);
    limpiarT = setTimeout(function () { if (!sale.classList.contains('on')) { pararZonas(sale); sale.textContent = ''; } }, 1300);
  }
  /* how long the slide on screen stays when others are in force: a composition its own dwell (60 s by default) */
  function tiempoDe(s) { return s && s.kind === 'composicion' ? (T.permanencia || s.permanencia || PERMANENCIA) : diapoMs; }
  function alDia(s) {                 /* the slide on screen, re-drawn in place when what it shows changed */
    var vm = modelo(s, estado()), f = firmaDe(vm);
    actual = s;
    if (f !== actualFirma) { construir(capas[frente], vm, capas[frente]); actualFirma = f; }
  }
  function revisar() {
    var est = estimar(), st = estado();
    aplicarLook(est);
    var off = !encendida(est);
    if (off !== apagado) { apagado = off; stage.classList.toggle('apagado', off); document.body.classList.toggle('apagado', off); }
    var cands = off ? [] : candidatas(est, st);
    visibles = cands.map(function (s) { return s.id; });
    if (off) {                                         /* outside the hours: black, nothing on it */
      if (actual) { capas.forEach(function (c) { c.classList.remove('on'); recordarZonas(c); pararZonas(c); c.textContent = ''; }); actual = null; actualFirma = ''; }
    } else if (!actual) poner(cands[0] || MARCA, 'fundido');
    else if (actual === MARCA) {   /* the brand slide only fills in: real content replaces it at once */
      if (cands.length && !(fijo && performance.now() - desde < diapoMs)) poner(cands[0], 'fundido'); else alDia(MARCA);
    }
    else {
      var cur = buscar(cands, actual.id);
      if (!cur) poner(siguiente(actual, cands) || MARCA, 'corte');     /* ended, paused, sold out, unverified: at once */
      else if (performance.now() - desde >= tiempoDe(cur) && cands.length > 1) poner(siguiente(cur, cands), 'fundido');
      else alDia(cur);
    }
    diagnostico(est, st);
  }

  /* ---------- the technician's box (diag=1) ---------- */
  var RAZON = {
    'sin-tv': 'la dirección no dice ?tv=',
    'tv-no-valida': 'el nombre de la TV en la dirección no es válido',
    'sin-funcion': 'la base de datos no tiene pantalla_datos: falta la migración 0036',
    'tv-desconocida': 'la TV «' + TV + '» no existe o está desactivada en Pantallas',
    'otra-clase': 'la TV «' + TV + '» no es una pantalla de promociones',
    'tv-apagada': 'la TV «' + TV + '» está apagada en Pantallas (pantalla negra)',
    'sin-lectura': 'todavía sin respuesta de la base de datos',
    'vista-previa': 'vista previa del Gestor: no lee la base de datos ni escribe nada; muestra lo que le manda'
  };
  function fechaCR(iso) {
    var t = Date.parse(iso);
    return isFinite(t) ? new Date(t - H6).toISOString().slice(0, 16).replace('T', ' ') : String(iso);
  }
  function diagnostico(est, st) {
    var d = $('diag');
    if (!AJ.diag) { d.hidden = true; return; }
    d.hidden = false; d.textContent = '';
    var add = function (k, v) { d.appendChild(el('b', '', k + ': ')); d.appendChild(document.createTextNode(v + '\n')); };
    var e = edad();
    add('TV', (AJ.tv || '(sin nombre)') + ' · ' + AJ.pulgadas + '" · ' + AJ.distancia + ' m' + (AJ.supuesto ? ' (supuesto: falta pulgadas o distancia)' : '') +
        ' · giro ' + AJ.giro + ' · escala ' + AJ.escala + ' % · ' + Math.round(diapoMs / 1000) + ' s por diapositiva');
    var dk = Object.keys(DIR);
    add('Origen', (fila ? 'base de datos (TV ' + TV + (fila.updated_at ? ', cambiados ' + fechaCR(fila.updated_at) : '') + ')'
        : 'dirección y valores por omisión (' + (RAZON[razon] || razon || '?') + ')') + (dk.length ? ' · de la dirección: ' + dk.join(', ') : ''));
    add('Horario', AJ.desde === null ? 'siempre encendida' : hhmm(AJ.desde) + '–' + hhmm(AJ.hasta) + ' · ' + (apagado ? (apagadaDueno ? 'APAGADA en Pantallas' : 'APAGADA: fuera de horario') : 'encendida'));
    add('Hora', 'Costa Rica ' + hhmm(minutoCR(est.hi)) + (srv ? ' (del servidor)' : ' (del aparato)') + ' · look ' + AJ.look + ' → ' + (dia ? 'dia' : 'noche'));
    add('Diapositivas', (PREVIEW ? (previa ? '1 recibida del Gestor' : 'ninguna recibida del Gestor') : datos.length + ' leídas') + ' · ' + visibles.length + ' vigentes ahora · en pantalla: ' +
        (actual ? (actual === MARCA ? 'la marca' : actual.kind + ' ' + actual.id.slice(0, 8)) : '–'));
    var cz = estadoZonas();
    if (cz) {
      add('Composición', 'plantilla ' + cz.plantilla + ' · ' + cz.zonas.length + (cz.zonas.length === 1 ? ' zona' : ' zonas') + ' · permanece ' +
          (visibles.length > 1 ? Math.round(cz.permanenciaMs / 1000) + ' s' : 'sola (hasta que termine)') + (actual.kick[0] ? ' · línea «' + actual.kick[0] + '»' : ''));
      cz.zonas.forEach(function (z, i) {
        add('Zona ' + (i + 1), (z.modo === 'auto' ? 'presentación cada ' + z.seg + ' s' : 'foto fija') + ' · ' + z.mostrables + ' de ' + z.entradas +
            (z.entradas === 1 ? ' entrada' : ' entradas') + ' con qué mostrar · ' + (z.labels ? 'con nombres y precios' : 'sin textos') + ' · ' +
            (z.estado === 'entrada' ? 'muestra la ' + (z.entrada + 1) + (z.titulo ? ' (' + z.titulo + (z.precio != null ? ', precio' : ', sin precio') + ')' : ' (solo foto)')
             : z.estado === 'respaldo' ? 'NADA QUE MOSTRAR: la foto de respaldo' : z.estado === 'marca' ? 'NADA QUE MOSTRAR: el diseño de marca' : 'cargando') +
            (z.sinIngles ? ' · sin inglés (no cabe)' : '') + (z.k < 1 ? ' · letra al ' + Math.round(z.k * 100) + ' % (no cabe)' : ''));
      });
    }
    if (cz && medidas.pxPorCm) add('Letra', 'nombres ' + (ZFACT.grande.zt * medidas.base * medidas.k).toFixed(2) + ' cm en zonas grandes, ' +
        (ZFACT.pequena.zt * medidas.base * medidas.k).toFixed(2) + ' en pequeñas · precios ' + (ZFACT.grande.zp * medidas.base * medidas.k).toFixed(2) + ' / ' +
        (ZFACT.pequena.zp * medidas.base * medidas.k).toFixed(2) + ' cm' + (medidas.cabe === false || medidas.k < 1 ? ' · NO CABE: baje la escala o la distancia' : ''));
    else add('Letra', medidas.pxPorCm ? 'título ' + (medidas.titulo * medidas.base).toFixed(2) + ' cm (meta ' + (1.2 * medidas.base).toFixed(2) + ', mínimo ' +
        (TIT_MIN * medidas.base).toFixed(2) + ') · precio ' + (1.5 * medidas.base * medidas.k).toFixed(2) + ' cm · textos ' + (0.8 * medidas.base * medidas.k).toFixed(2) + ' cm' +
        (medidas.cabe === false || medidas.k < 1 ? ' · NO CABE: baje la escala o la distancia' : '') : '–');
    if (medidas.qrCm) add('QR', 'lado ' + medidas.qrCm.toFixed(1) + ' cm (mínimo ' + medidas.qrMinCm.toFixed(1) + ')' + (medidas.qrPequeno ? ' · PEQUEÑO para esa distancia' : ''));
    if (qrEstado !== 'listo' && datos.some(function (s) { return s.kind === 'invitacion'; })) add('QR', 'la biblioteca no cargó: solo la dirección en texto');
    add('Precios', st + ' · última lectura hace ' + (e === Infinity ? 'nunca' : Math.round(e / 1000) + ' s') + (dudoso ? ' · sin verificar desde una pausa' : '') +
        ' · ' + buenas + ' de ' + intentos + ' lecturas');
    add('Versión', (window.HG_VERSION && HG_VERSION.build) || '?');
    if (malos.length) add('Ajustes no válidos', malos.join(', '));
    if (malosBase.length) add('Ajustes de la base no válidos', malosBase.join(', '));
  }

  /* ---------- full screen and a screen that stays on (as tv.html) ---------- */
  function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function goFull() {
    if (isFull()) return;
    var de = document.documentElement, fn = de.requestFullscreen || de.webkitRequestFullscreen;
    if (!fn) return;
    try { var p = fn.call(de); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
  addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ' || e.keyCode === 13 || e.keyCode === 23) goFull(); });
  addEventListener('click', goFull);
  var wakeLock = null;
  async function keepAwake() {
    try { if (navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', function () { wakeLock = null; }); } }
    catch (e) { wakeLock = null; }
  }
  function fsHint() {
    var can = document.fullscreenEnabled || document.webkitFullscreenEnabled;
    if (!can || isFull()) return;
    var h = $('fsHint'); h.classList.add('on');
    setTimeout(function () { h.classList.remove('on'); }, 12000);
  }
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) {
    document.addEventListener(ev, function () { $('fsHint').classList.remove('on'); setTimeout(function () { orientar(); revisar(); }, 300); });
  });

  /* ---------- the tick: every second; reads on the monotonic clock; a pause in either clock makes prices unverified ---------- */
  var vivoPerf = 0, vivoReloj = 0;
  function vivo() { vivoPerf = performance.now(); vivoReloj = Date.now(); }
  function tick() {
    var dp = performance.now() - vivoPerf, dr = Date.now() - vivoReloj;
    if (dp > SALTO || Math.abs(dr) > SALTO) { dudar('pausa'); return; }
    if (performance.now() - ultimoIntento >= T.cada - 50) refrescar();
    revisar(); vivo();
  }
  function alVolver() { dudar('vuelta'); keepAwake(); }
  var fuenteT = null;
  function fuentesCargadas() {   /* a web font finished loading: measure the letter again and draw again */
    clearTimeout(fuenteT);
    fuenteT = setTimeout(function () { proporciones = {}; fuentesN++; revisar(); }, 60);
  }

  /* ---------- start ---------- */
  window.PANTALLA_B = {
    info: function () {
      var est = estimar();
      return JSON.parse(JSON.stringify({
        estado: estado(), edadMs: edad() === Infinity ? null : edad(), ahora: est.hi, ahoraMin: est.lo,
        visibles: visibles.slice(), actual: actual ? actual.id : null, tipo: actual ? actual.kind : null,
        tv: { id: TV, pulgadas: AJ.pulgadas, distancia: AJ.distancia, giro: AJ.giro, escala: AJ.escala, look: AJ.look,
              diapositiva: AJ.diapositiva, desde: AJ.desde === null ? null : hhmm(AJ.desde), hasta: AJ.hasta === null ? null : hhmm(AJ.hasta),
              origen: origen },
        fuente: fuente(), razon: razon, dudoso: dudoso, duda: duda, apagado: apagado, look: dia ? 'dia' : 'noche',
        horaCR: hhmm(minutoCR(est.hi)), horaDe: srv ? 'servidor' : 'aparato', leidas: datos.map(function (s) { return s.id; }),
        intentos: intentos, buenas: buenas, tiempos: T, diapositivaMs: diapoMs, salto: SALTO, medidas: medidas, qr: qrEstado,
        malos: malos, malosBase: malosBase, preview: PREVIEW, permanenciaMs: actual ? tiempoDe(actual) : null, composicion: estadoZonas()
      }));
    },
    refrescar: refrescar,
    /* for the tests and the technician: show this slide now, if it is in force */
    mostrar: function (id) {
      var est = estimar(), s = id === 'marca' ? MARCA : buscar(candidatas(est, estado()), id);
      if (!s || apagado) return false;
      poner(s, 'corte'); fijo = true; diagnostico(est, estado());
      return true;
    }
  };
  /* the owner's preview: the slide the parent window posts (the same origin only), drawn as if it were in force */
  if (PREVIEW) {
    addEventListener('message', function (e) {
      if (e.source !== window.parent || e.origin !== location.origin || !e.data || typeof e.data !== 'object' || e.data.tipo !== 'pantalla-preview') return;
      var lista = [];
      try { lista = normalizar([e.data.slide], true); } catch (x) { lista = []; }
      previa = lista[0] || null;
      precargar();
      if (previa && previa.kind === 'invitacion') cargarQR();
      revisar();
    });
  }
  calcularAjustes();
  orientar();
  revisar(); vivo();
  cargarQR();
  refrescar();
  setInterval(tick, TICK);
  addEventListener('resize', function () { orientar(); revisar(); });
  addEventListener('online', function () { refrescar(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) alVolver(); });
  addEventListener('pageshow', function (e) { if (e.persisted) alVolver(); });
  document.addEventListener('resume', alVolver);
  if (document.fonts) {
    if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', fuentesCargadas);
    if (document.fonts.ready) document.fonts.ready.then(fuentesCargadas);
  }
  fsHint(); keepAwake();
})();
</script>
</body>
