<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="hg-build" content="__BUILD__">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú · Pantalla A · Hanging Garden</title>
<meta name="robots" content="noindex">
<!--
  Canopy OS · SCREEN A: the menu with prices for the guests (docs/PANTALLAS.md, migration 0036).
  * Read only: GET menu_categories (+ items) and GET rpc/pantalla_datos (this TV's settings and the server time), both
    with the public key. Nothing is written, nobody signs in.
  * Prices only from a verified read of this session, with its age measured (the larger of the monotonic clock and the
    wall clock, counted from the moment the read STARTED); never stored on the device:
      up to 2 min -> shown; 2 to 10 min -> shown with «Precios por confirmar en caja»;
      older, never, or after a pause/resume until the next read -> no price at all, «Consulte los precios en la caja».
  * Settings: built-in defaults < this TV's row (pantallas.html, read every 30 s) < the address, so a technician can
    still override: ?tv=menu-1&pulgadas=55&distancia=3&giro=no|derecha|izquierda&escala=100&look=auto|dia|noche&pagina=28&diag=1
    Capital letter 1 cm per metre of reading distance (never under 0.8), titles 1.5x, English 75 %.
    giro=derecha turns the picture right, for a TV whose top edge ended up on the LEFT (like tv.html).
  * From the TV's row only: which categories (null = all), sold-out items hidden or struck through (never a price), and
    the hours (Costa Rica, UTC-6 all year): outside them the screen is black.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Figtree:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#0F2418; --ink:#F6F1E2; --soft:#C9D3BC; --gold:#DBB365; --cat:#A9C9A4; --line:#2E4A36;
  --warn:#F2C14E; --warn-ink:#1B1405; --f:32px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:#0A1A10;overflow:hidden;cursor:none}
.hg-lang{display:none !important}   /* no language switch: the screen shows both languages at once */

/* the stage is sized and turned in pixels by orientar(), from the real window (like tv.html) */
#stage{position:absolute;top:0;left:0;overflow:hidden;transform-origin:0 0;display:flex;flex-direction:column;
  padding:2.2% 2.6%;color:var(--ink);font-family:'Figtree',system-ui,sans-serif;
  background:radial-gradient(120% 90% at 50% 0%,#1A3A26 0%,var(--bg) 70%)}
/* daylight look: a bright screen outshines the reflection of a window (same colours as tv.html's) */
#stage.dia{--bg:#FFFBF1;--ink:#0F2618;--soft:#2F3F33;--gold:#7A4A00;--cat:#1E4B33;--line:#C9A253;background:#FFFBF1}
/* outside the TV's hours: a black screen, nothing on it (the technician's box only with diag=1) */
body.apagado,#stage.apagado{background:#000}
#stage.apagado > :not(#diag){display:none !important}

/* the header has one height in every state (page number, warning or not): the board below never changes size, so a
   warning never moves the menu to other pages */
header{display:flex;align-items:center;gap:calc(var(--f)*.8);font-size:calc(var(--f)*.72);height:calc(var(--f)*1.75);overflow:hidden;
  padding-bottom:calc(var(--f)*.3);border-bottom:2px solid var(--line)}
.marca{font-family:'Playfair Display',Georgia,serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);
  display:flex;align-items:center;gap:.45em;white-space:nowrap;line-height:1.2;min-width:0;overflow:hidden}
.marca svg{width:1.05em;height:1.05em;flex:none}
.marca small{font-family:'Figtree',system-ui,sans-serif;font-weight:700;letter-spacing:.08em;color:var(--soft);font-size:.8em}
/* the warning shrinks its letter to fit (ajustarAviso), never under 0.4 of the names */
#aviso{flex:1;min-width:0;font-size:calc(var(--f)*.66);font-weight:800;line-height:1.08;background:var(--warn);color:var(--warn-ink);
  border-radius:calc(var(--f)*.2);padding:calc(var(--f)*.08) calc(var(--f)*.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#aviso small{display:block;font-size:.79em;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.esp{flex:1}
#pag{display:block;height:1.2em;line-height:1.2;font-weight:800;font-size:calc(var(--f)*.9);font-variant-numeric:tabular-nums;color:var(--soft);white-space:nowrap}

main{flex:1;min-height:0;position:relative;margin-top:calc(var(--f)*.55)}
.page,#medida{position:absolute;inset:0;column-gap:calc(var(--f)*1.4);column-fill:auto;overflow:hidden}
.page{opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
.page.on{opacity:1;visibility:visible;transition:opacity .6s ease}
.page.ya{transition:none}                    /* a rebuilt board replaces the old one at once, never through a blank */
#medida{visibility:hidden;pointer-events:none}

.cat{padding-bottom:calc(var(--f)*.65)}
.cab{break-inside:avoid}                     /* a title never stays alone at the bottom of a column */
.cat h2{margin:0 0 calc(var(--f)*.2);font-size:calc(var(--f)*1.5);font-weight:800;line-height:1.08;color:var(--cat);
  display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.4em}
.cat h2 .cen{font-size:.5em;font-weight:700;color:var(--soft);letter-spacing:.04em}
.it{break-inside:avoid;padding:calc(var(--f)*.12) 0 calc(var(--f)*.26)}
.l1{font-size:var(--f);font-weight:700;line-height:1.12}
.pr{font-weight:800;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
.pr .cur{font-size:.8em;margin-right:.04em}
.en{font-size:calc(var(--f)*.75);font-weight:500;color:var(--soft);line-height:1.12;margin-top:.04em}
/* sold out, when the TV is set to show it: struck through, a label, never a price */
.it.agotado .es,.it.agotado .en{text-decoration:line-through;text-decoration-thickness:.08em;color:var(--soft)}
.ago{display:inline-block;font-size:.75em;font-weight:800;color:var(--soft);white-space:nowrap;line-height:1.1;
  border:.09em solid currentColor;border-radius:.3em;padding:0 .3em;vertical-align:.08em}

footer{display:flex;align-items:baseline;justify-content:space-between;gap:1em;border-top:2px solid var(--line);
  padding-top:calc(var(--f)*.25);font-size:calc(var(--f)*.55);color:var(--soft);font-weight:500}

#vacio{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.4em}
#vacio .t1{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:calc(var(--f)*2.2);color:var(--gold)}
#vacio .t2{font-size:calc(var(--f)*1.1);font-weight:700}
#vacio .t3{font-size:calc(var(--f)*.85);color:var(--soft)}

#diag{position:absolute;right:1%;bottom:1%;z-index:6;max-width:46%;background:rgba(0,0,0,.82);color:#fff;border-radius:8px;
  font:500 calc(var(--f)*.36)/1.35 'Figtree',system-ui,sans-serif;padding:.6em .9em;white-space:pre-wrap}
#diag b{color:#F2C14E}
#fsHint{position:absolute;left:50%;top:1.5%;transform:translateX(-50%);z-index:5;background:rgba(10,26,16,.9);color:#F6F1E2;
  font:700 calc(var(--f)*.5)/1.3 'Figtree',system-ui,sans-serif;padding:.5em 1.2em;border-radius:99px;white-space:nowrap;
  opacity:0;transition:opacity .6s;pointer-events:none}
#fsHint.on{opacity:1}
@media (prefers-reduced-motion:reduce){.page,.page.on{transition:none}}
</style>
</head>
<body>
<div id="stage" data-no-translate>
  <header>
    <span class="marca" id="marca"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.6 3.3C9.5 3.6 4.6 9 4.4 15.9c0 1.8.4 3.4 1.2 4.8.5-4 2.3-8.1 5.9-11-2.7 3.5-4.2 7.8-4.3 11.6.7.3 1.5.4 2.3.4 3 0 5.6-1.2 7.4-3.3 2.6-3.1 3-9.6.7-15.1z"/></svg>Hanging Garden Café <small>· Menú · Menu</small></span>
    <span id="aviso" role="status" hidden></span>
    <span class="esp" id="esp"></span>
    <span id="pag"></span>
  </header>
  <main id="main"><div id="medida" aria-hidden="true"></div><div id="vacio" hidden></div></main>
  <footer><span id="nota">Precios en colones, IVA incluido · Prices in colones, tax (IVA) included</span></footer>
  <div id="diag" hidden></div>
  <div id="fsHint">Pulse OK en el control para pantalla completa · Press OK for full screen</div>
</div>

<script src="config.js"></script>
<script src="lang.js"></script>
<script>
/* the screen updates itself after a release (version.js), without a notice to the guests, at any moment */
window.HG_VERSION_NOTICE = function () {};
window.HG_SAFE_TO_RELOAD = function () { return true; };
</script>
<script src="version.js" defer></script>
<script>
(function () {
  'use strict';
  var CFG = window.HG_CONFIG || {};
  var DEMO = window.PANTALLA_DEMO || null;          /* the private demonstration supplies its own menu */
  /* times in ms; only the tests and the demonstration shorten them (window.PANTALLA_TEST) */
  var T = { fresco: 2 * 60000, vencido: 10 * 60000, cada: 30000, revisar: 5000, pagina: 0, copiaMax: 3 * 86400000, limite: 12000 };
  try {
    var over = window.PANTALLA_TEST || {};
    Object.keys(over).forEach(function (k) { if (k in T && Number(over[k]) > 0) T[k] = Number(over[k]); });
  } catch (e) {}
  var TICK = Math.min(T.cada, T.revisar);
  /* a pause longer than 3 ticks in either clock (sleep, frozen tab, clock moved): prices unverified until a read.
     Never under 3 s, so a busy device with test timings does not count as asleep */
  var SALTO = Math.max(3 * TICK, 3000);
  var SKIP = { 'Extras & Combos': 1 };               /* the till's helpers and the combo line: never on a screen */
  var COPIA = 'hg-pantalla-menu';                    /* this TV's copy of the names (never the prices) */
  var COPIA_TV = 'hg-pantalla-menu-tv';              /* this TV's copy of its settings row (no prices in it) */
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), main = $('main'), medida = $('medida');

  /* ---------- the address ---------- */
  var Q = (function () {
    var o = {};
    /* the private demonstration has no address of its own: it passes the settings itself */
    String(DEMO && typeof DEMO.ajustes === 'string' ? DEMO.ajustes : location.search).replace(/^\?/, '').split('&').forEach(function (kv) {
      if (!kv) return; var i = kv.indexOf('='), k = i < 0 ? kv : kv.slice(0, i), v = i < 0 ? '' : kv.slice(i + 1);
      try { o[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' ')); } catch (e) {}
    });
    return o;
  })();
  var malos = [];                                    /* address values not valid (named in the diagnosis) */
  var LIM = { pulgadas: [24, 110, 'inches'], distancia: [1, 15, 'distance_m'], escala: [70, 160, 'scale_pct'], pagina: [15, 60, 'page_seconds'] };
  var DEF = { pulgadas: 55, distancia: 3, escala: 100, pagina: 28, giro: 'no', look: 'auto' };
  var OPC = { giro: [/^(no|derecha|izquierda)$/, 'turn'], look: [/^(auto|dia|noche)$/, 'look'] };
  var DIR = {};                                      /* the valid values the address gives */
  Object.keys(LIM).forEach(function (k) {
    if (Q[k] === undefined || Q[k] === '') return;
    var n = Number(String(Q[k]).replace(',', '.'));
    if (isFinite(n) && n >= LIM[k][0] && n <= LIM[k][1]) DIR[k] = n; else malos.push(k + '=' + Q[k]);
  });
  Object.keys(OPC).forEach(function (k) {
    if (Q[k] === undefined || Q[k] === '') return;
    if (OPC[k][0].test(Q[k])) DIR[k] = Q[k]; else malos.push(k + '=' + Q[k]);
  });
  var TV = String(Q.tv || '').trim().toLowerCase().slice(0, 40);
  var TV_OK = /^[a-z0-9][a-z0-9-]{1,29}$/.test(TV);
  if (TV && !TV_OK) malos.push('tv=' + Q.tv);

  /* ---------- this TV's settings: defaults < its row in the database < the address ---------- */
  var fila = null, filaDe = null;                    /* the row in use, and where from: 'base' (a read) or 'copia' */
  var razon = null;                                  /* why there is no row */
  var AJ = null, origen = {}, malosBase = [], paginaMs = 0;
  var CAMPOS_FILA = ['id', 'kind', 'inches', 'distance_m', 'turn', 'scale_pct', 'look', 'page_seconds', 'category_ids',
                     'sold_out', 'on_from', 'on_to', 'updated_at'];
  function hm(s) {
    var m = /^([01]\d|2[0-3]):([0-5]\d)/.exec(String(s || ''));
    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
  }
  function hhmm(m) { return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2); }
  function calcularAjustes() {
    var f = fila, aj = { tv: TV || String(Q.tv || '').slice(0, 40), diag: Q.diag === '1' }, o = {};
    malosBase = [];
    Object.keys(LIM).forEach(function (k) {
      var L = LIM[k], v = DEF[k], de = 'omision';
      if (f && f[L[2]] != null) {
        var n = Number(f[L[2]]);
        if (isFinite(n) && n >= L[0] && n <= L[1]) { v = n; de = 'base'; } else malosBase.push(L[2] + '=' + f[L[2]]);
      }
      if (k in DIR) { v = DIR[k]; de = 'direccion'; }
      aj[k] = v; o[k] = de;
    });
    Object.keys(OPC).forEach(function (k) {
      var v = DEF[k], de = 'omision', b = f ? f[OPC[k][1]] : null;
      if (b != null) { if (OPC[k][0].test(String(b))) { v = String(b); de = 'base'; } else malosBase.push(OPC[k][1] + '=' + b); }
      if (k in DIR) { v = DIR[k]; de = 'direccion'; }
      aj[k] = v; o[k] = de;
    });
    aj.agotados = f && f.sold_out === 'tachar' ? 'tachar' : 'ocultar';
    aj.categorias = f && Array.isArray(f.category_ids) && f.category_ids.length
      ? f.category_ids.map(function (x) { return String(x).toLowerCase(); }) : null;
    var a = f ? hm(f.on_from) : null, b = f ? hm(f.on_to) : null;
    aj.desde = a !== null && b !== null && a !== b ? a : null;
    aj.hasta = aj.desde !== null ? b : null;
    aj.supuesto = o.pulgadas === 'omision' || o.distancia === 'omision';
    AJ = aj; origen = o;
  }
  function aplicarAjustes() {
    var giro = AJ && AJ.giro;
    calcularAjustes();
    if (giro !== AJ.giro) orientar();
    paginaMs = T.pagina || AJ.pagina * 1000;
    armarPaginas();
    derivar();
  }
  function copiaTv() {
    try {
      var v = JSON.parse(localStorage.getItem(COPIA_TV) || 'null'), e = v ? Date.now() - Number(v.at) : -1;
      if (v && v.tv === TV && v.fila && typeof v.fila === 'object' && e >= 0 && e <= T.copiaMax) return v.fila;
    } catch (e) {}
    return null;
  }
  function fijarFila(f, por) {
    fila = f; filaDe = f ? 'base' : null; razon = f ? null : por;
    try {
      if (f) {
        var g = {}; CAMPOS_FILA.forEach(function (k) { if (k in f) g[k] = f[k]; });
        localStorage.setItem(COPIA_TV, JSON.stringify({ at: Date.now(), tv: TV, fila: g }));
      } else localStorage.removeItem(COPIA_TV);
    } catch (e) {}
    aplicarAjustes();
  }

  /* ---------- the server's time, and Costa Rica's (UTC-6 all year) ---------- */
  var srv = null;                                    /* {ms: server time, perf, reloj: when it arrived} */
  function ahoraMs() {
    if (!srv) return Date.now();                     /* no server time yet: the device's clock */
    var a = performance.now() - srv.perf, b = Date.now() - srv.reloj;
    return srv.ms + Math.max(a, b >= 0 ? b : 0);
  }
  function minutoCR(ms) { var m = Math.floor(ms / 60000) - 360; return ((m % 1440) + 1440) % 1440; }
  var apagadaDueno = false;         /* switched off by the owner in pantallas.html: black until a read says otherwise */
  function encendida() {
    if (apagadaDueno) return false;
    if (AJ.desde === null) return true;
    var t = minutoCR(ahoraMs());
    return AJ.desde < AJ.hasta ? t >= AJ.desde && t < AJ.hasta : t >= AJ.desde || t < AJ.hasta;   /* overnight */
  }

  /* ---------- the menu: read only ---------- */
  var crudo = null;                  /* the last good answer of this session (memory only, never stored) */
  var menu = null;                   /* [{es, en, items:[{es, en, precio, agotado}]}] */
  var deCopia = false;               /* the names on screen come from this TV's copy: no prices */
  var okPerf = null, okReloj = null; /* when the last good read STARTED: monotonic clock and wall clock */
  var conEs = true, leyendo = false, leyendoDesde = 0, ultimoIntento = -1e12, lecturaN = 0, otraVez = false;
  var dudoso = false, dudaN = 0;     /* after a pause or a resume: no price until a read that started after it */
  var info = { estado: 'sin-verificar', maquetas: 0, categorias: 'todas' };

  function plano(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }
  function clave(s) {
    s = plano(s).toLowerCase();
    return s.normalize ? s.normalize('NFD').replace(/[̀-ͯ]/g, '') : s;
  }
  /* Spanish as on the QR menu: the Menu Manager's name_es, else the site's exact dictionary, else the name once */
  function espanol(en, es) {
    es = plano(es); if (es) return es;
    var t = null; try { t = window.HG_EXACT ? window.HG_EXACT(en) : null; } catch (e) {}
    return plano(t) || plano(en);
  }
  function limpiar(raw) {
    if (!Array.isArray(raw)) throw new Error('respuesta inesperada');
    var validas = raw.filter(function (c) { return c && plano(c.name) && !SKIP[plano(c.name)]; });
    var elegidas = null;
    info.categorias = 'todas'; info.categoriasFaltan = 0;
    if (AJ.categorias) {
      var set = {}, hay = 0;
      AJ.categorias.forEach(function (id) { set[id] = 1; });
      validas.forEach(function (c) { if (set[String(c.id).toLowerCase()]) hay++; });
      if (hay) { elegidas = set; info.categorias = 'elegidas'; info.categoriasFaltan = AJ.categorias.length - hay; }
      else info.categorias = 'no-existen';          /* none of them is in the menu any more: all, and the diagnosis says so */
    }
    var tachar = AJ.agotados === 'tachar';
    var cats = validas.map(function (c, ci) {
      if (elegidas && !elegidas[String(c.id).toLowerCase()]) return null;
      var items = (Array.isArray(c.menu_items) ? c.menu_items : []).filter(function (i) {
        var p = Number(i && i.price_crc);
        if (!i || !plano(i.name) || !(isFinite(p) && p > 0)) return false;
        return i.available === true || (tachar && i.available === false);
      }).sort(function (a, b) {
        return ((Number(a.sort) || 0) - (Number(b.sort) || 0)) || String(a.name).localeCompare(String(b.name));
      }).map(function (i) {
        var en = plano(i.name), es = espanol(en, i.name_es), ago = i.available !== true;
        return { es: es, en: clave(es) === clave(en) ? '' : en, precio: ago ? null : Math.round(Number(i.price_crc)), agotado: ago };
      });
      var en = plano(c.name), es = espanol(en, null);
      return { es: es, en: clave(es) === clave(en) ? '' : en, sort: Number(c.sort) || 0, ci: ci, items: items };
    }).filter(function (c) { return c && c.items.length; });
    cats.sort(function (a, b) { return (a.sort - b.sort) || (a.ci - b.ci); });
    return cats.map(function (c) { return { es: c.es, en: c.en, items: c.items }; });
  }
  function derivar() { if (crudo) { try { menu = limpiar(crudo); } catch (e) {} } }

  /* one GET; the time limit (12 s) covers the answer's body too */
  async function pedir(url) {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, T.limite) : null;
    try {
      var res = await fetch(url, { headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key }, cache: 'no-store',
                                   signal: ctl ? ctl.signal : undefined });
      var out = { status: res.status, ok: res.ok, body: null, text: '' };
      if (res.ok) out.body = await res.json();
      else { try { out.text = await res.text(); } catch (e) {} }
      return out;
    } finally { if (timer) clearTimeout(timer); }
  }
  async function leerMenu() {
    if (DEMO && typeof DEMO.menu === 'function') return DEMO.menu();
    for (var n = 0; n < 2; n++) {
      var sel = 'id,name,sort,menu_items(name,price_crc,available,sort' + (conEs ? ',name_es' : '') + ')';
      var r = await pedir(CFG.url + '/rest/v1/menu_categories?select=' + encodeURIComponent(sel) + '&order=sort');
      if (r.ok) return r.body;
      if (r.status === 400 && conEs && /name_es/.test(r.text)) { conEs = false; continue; }   /* menu-spanish.sql not applied */
      throw new Error('menu ' + r.status);
    }
    throw new Error('menu');
  }
  async function leerDatos() {
    if (DEMO) return typeof DEMO.datos === 'function' ? { status: 200, ok: true, body: await DEMO.datos() } : null;
    if (!TV_OK) return null;
    return pedir(CFG.url + '/rest/v1/rpc/pantalla_datos?p_tv=' + encodeURIComponent(TV));
  }
  function usarDatos(r) {
    if (!r) return;
    if (r.ok && r.body && typeof r.body === 'object') {
      var b = r.body, t = Date.parse(b.now);
      if (isFinite(t)) srv = { ms: t, perf: performance.now(), reloj: Date.now() };
      if (b.ok === true && b.tv && typeof b.tv === 'object') {
        apagadaDueno = false;
        if (b.tv.kind && b.tv.kind !== 'menu') fijarFila(null, 'otra-clase');
        else fijarFila(b.tv, null);
      } else if (b.ok === false && b.error === 'tv_apagada') { apagadaDueno = true; razon = 'tv-apagada'; }
      else if (b.ok === false && b.error === 'unknown_tv') { apagadaDueno = false; fijarFila(null, 'tv-desconocida'); }
    } else if (r.status === 404 || r.status === 400) { apagadaDueno = false; fijarFila(null, 'sin-funcion'); }   /* migration 0036 not applied */
    /* anything else (a server error): the settings in use stay */
  }
  function guardar(m) {

  /* ---------- how old the prices are ---------- */

    leyendo = true; leyendoDesde = p0; ultimoIntento = p0; otraVez = false;
    var a = asentar(leerMenu()), b = asentar(leerDatos());
    var rm = await a, rd = await b;

    try {
      if (rd.ok) usarDatos(rd.v);
      if (rm.ok) {
        if (!Array.isArray(rm.v) || !rm.v.length) throw new Error('menú vacío');
        var m = limpiar(rm.v);

  function dudar(por) {

  /* ---------- the stage: size, turn, look ---------- */
  var anchoE = 0, altoE = 0;

      stage.style.transform = AJ.giro === 'derecha' ? 'translate(' + W + 'px,0) rotate(90deg)' : 'translate(0,' + H + 'px) rotate(-90deg)';
      anchoE = H; altoE = W;

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

  /* a category, or the part of it from item a to item b */

    h.appendChild(el('span', 'ces', c.es));

  /* a category title is 1.5 times the names; a word too long for its column («costarricenses») makes only that title

  function titulos(root) {

  /* more columns than the page has (they appear to the right, past the gap), or a line wider than its column */
  function desborda(box) {

    if (box.scrollWidth > box.clientWidth + gap / 2 || box.scrollHeight > box.clientHeight + 1) return true;
    var ls = box.querySelectorAll('.l1, .en, h2');
    for (var i = 0; i < ls.length; i++) if (ls[i].scrollWidth > ls[i].clientWidth + 1) return true;
    return false;

  /* pages for a letter size and a number of columns: categories in order, a category moves whole to the next page;

  function paginar(f, cols, conPrecios) {
    stage.style.setProperty('--f', f + 'px');
    medida.style.columnCount = cols;
    medida.textContent = '';
    var pags = [], cur = [], cabe = true;
    function cerrar() { if (cur.length) pags.push(cur); cur = []; medida.textContent = ''; }
    menu.forEach(function (c, ci) {
      var a = 0;
      while (a < c.items.length) {
        var nodo = catNodo(c, a, c.items.length, conPrecios);
        medida.appendChild(nodo); titulos(nodo);
        if (!desborda()) { cur.push([ci, a, c.items.length]); return; }
        medida.removeChild(nodo);
        if (cur.length) { cerrar(); continue; }               /* try again on an empty page */
        /* longer than a page: as many items as fit, the rest on the next page */
        var b = a + 1;

        while (b < c.items.length) {

  var paginas = [], pagIx = 0, firma = '';
  function quitarPaginas() { [].slice.call(main.querySelectorAll('.page')).forEach(function (p) { p.remove(); }); paginas = []; mostrar(0); }
  function maquetar(conPrecios) {

    var min = 0.8 * base, meta = 1.0 * base, max = 1.25 * base;

    var opciones = altoE > anchoE ? [1, 2] : [3, 2];
    var mejor = null, cache = {};
    function n(cap, cols) { var k = cols + '|' + cap.toFixed(4); if (!cache[k]) cache[k] = paginar(fpx(cap), cols, conPrecios); return cache[k].pags.length; }
    opciones.forEach(function (cols) {
      var nMin = n(min, cols), nMeta = n(meta, cols), a, b, lim;

    });

    medida.textContent = '';
    /* the new pages first, the current one shown at once (no fade), then the old ones go: the board is never blank */
    var viejas = [].slice.call(main.querySelectorAll('.page'));
    var nuevas = plan.pags.map(function (pg) {
      var d = el('div', 'page'); d.style.columnCount = mejor.cols;
      pg.forEach(function (part) { d.appendChild(catNodo(menu[part[0]], part[1], part[2], conPrecios)); });
      main.appendChild(d); titulos(d);

    info.cabe = plan.cabe && !paginas.some(function (p) { return desborda(p); }); info.pxPorCm = pxCm; info.fuentePx = fpx(mejor.cap); info.proporcionH = r;
    info.partes = plan.pags.map(function (pg) { return pg.map(function (p) { return { categoria: menu[p[0]].es, desde: p[1], hasta: p[2] }; }); });
  }

  function mostrar(i) {
    pagIx = paginas.length ? ((i % paginas.length) + paginas.length) % paginas.length : 0;

  var pagTimer = null, pagArmado = 0;

  /* the warning is never cut: its letter shrinks to the header's width, never under 0.4 of the names */
  function ajustarAviso() {

    var f = parseFloat(stage.style.getPropertyValue('--f')) || 32, min = 0.4 * f, sm = av.querySelector('small');

  function pintar(forzar) {

    })]);

  var RAZON = {

  /* ---------- full screen and a screen that stays on (as tv.html) ---------- */

  addEventListener('click', goFull);

  /* ---------- the tick: reads on the monotonic clock; a pause in either clock makes prices unverified ---------- */

  document.addEventListener('visibilitychange', function () { if (!document.hidden) alVolver(); });
  addEventListener('pageshow', function (e) { if (e.persisted) alVolver(); });
  document.addEventListener('resume', alVolver);
  if (document.fonts) {
    if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', fuentesCargadas);
    if (document.fonts.ready) document.fonts.ready.then(fuentesCargadas);
  }
  fsHint(); keepAwake();
})();
</script>
