<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="hg-build" content="__BUILD__">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú · Pantalla A · Hanging Garden</title>
<meta name="robots" content="noindex">
<!--
  Canopy OS · SCREEN A: the menu with prices for the guests (docs/PANTALLAS.md, migrations 0036 and 0037).
  * Read only: GET menu_categories (+ items) and GET rpc/pantalla_datos (this TV's settings, the server time and, when
    the owner intercalates promotions, this TV's slides), both with the public key. Nothing is written, nobody signs in.
  * Prices only from a verified read of this session, with its age measured (the larger of the monotonic clock and the
    wall clock, counted from the moment the read STARTED); never stored on the device:
      up to 2 min -> shown; 2 to 10 min -> shown with «Precios por confirmar en caja»;
      older, never, or after a pause/resume until the next read -> no price at all, «Consulte los precios en la caja».
  * The board (v2): every category is a block (its title first, then its items) packed in the Menu Manager's order
    into explicit columns (3, 4 or 5 on a landscape TV; 1 or 2 turned), so a title never lands between another
    category's items and every column starts with a title. A block that does not fit in what is left of a column
    is cut there and continues at the top of the next column under its title with «(continúa)», as long as both
    pieces keep two items or more; otherwise it moves whole. The columns of a page are filled to nearly the same
    height, with no hole the next piece could have filled. The letter: one screen whenever the capital letter can stay
    at or over the minimum (0.8 cm per metre); otherwise the fewest pages with the largest letter. Never under the
    minimum. Density «compacta» and the English «debajo | en-linea | no» are the owner's choices per TV.
  * Promotions: with promo_mode = intercalar the TV's slides (in force by the server's time, days and hours; a product
    only while it can be sold) interrupt the menu every promo_every s for promo_seconds s, with a fade, and the same
    page of the menu comes back. Nothing in force: the menu is never interrupted. The slides' prices follow the
    menu's freshness rule. The slides live in memory only (never on the device). A slide is drawn by a copy of
    Screen B's renderer (pantalla-promos.html), so a promotion looks the same on both TVs: the same letters per
    metre, the same compositions (zones with presentations of their own, labels, fallback, framing, dissolve).
  * Settings: built-in defaults < this TV's row (pantallas.html, read every 30 s) < the address, so a technician can
    still override: ?tv=menu-1&pulgadas=55&distancia=3&giro=no|derecha|izquierda&escala=100&look=auto|dia|noche&pagina=28
    &densidad=normal|compacta&ingles=debajo|en-linea|no&layout=auto|una-pantalla|paginas&promo=no|intercalar
    &promo_cada=180&promo_seg=10&diag=1
    Capital letter 1 cm per metre of reading distance (never under 0.8), titles 1.5x (1.3x compact), English 75 %.
    giro=derecha turns the picture right, for a TV whose top edge ended up on the LEFT (like tv.html).
  * From the TV's row only: which categories (null = all), sold-out items hidden or struck through (never a price), and
    the hours (Costa Rica, UTC-6 all year): outside them the screen is black.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Figtree:wght@500;600;700;800&display=swap">
<style>
:root{
  --bg:#0F2418; --ink:#F6F1E2; --soft:#C9D3BC; --gold:#DBB365; --cat:#A9C9A4; --line:#2E4A36;
  --warn:#F2C14E; --warn-ink:#1B1405; --f:32px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:#0A1A10;overflow:hidden;cursor:none}
.hg-lang{display:none !important}   /* no language switch: the screen shows both languages at once */

/* the stage is sized and turned in pixels by orientar(), from the real window (like tv.html).
   Every size is a multiple of --f (the pixel size of an item's name, chosen by the engine); the density «normal»
   multipliers live here and «compacta» (#stage.compacta) tightens them */
#stage{position:absolute;top:0;left:0;overflow:hidden;transform-origin:0 0;display:flex;flex-direction:column;
  padding:2.2% 2.6%;color:var(--ink);font-family:'Figtree',system-ui,sans-serif;
  background:radial-gradient(120% 90% at 50% 0%,#1A3A26 0%,var(--bg) 70%);
  --tit:1.5;--lh:1.12;--en:.75;--padA:.12;--padB:.26;--h2mb:.2;--hdr:1.75;--hdrPad:.3;--mainTop:.55;--footTop:.25}
#stage.compacta{--tit:1.3;--lh:1.06;--en:.72;--padA:.05;--padB:.12;--h2mb:.12;--hdr:1.5;--hdrPad:.2;--mainTop:.35;--footTop:.15}
/* daylight look: a bright screen outshines the reflection of a window (same colours as tv.html's) */
#stage.dia{--bg:#FFFBF1;--ink:#0F2618;--soft:#2F3F33;--gold:#7A4A00;--cat:#1E4B33;--line:#C9A253;background:#FFFBF1}
/* outside the TV's hours: a black screen, nothing on it (the technician's box only with diag=1) */
body.apagado,#stage.apagado{background:#000}
#stage.apagado > :not(#diag){display:none !important}

/* the header has one height in every state (page number, warning or not): the board below never changes size, so a
   warning never moves the menu to other pages */
header{display:flex;align-items:center;gap:calc(var(--f)*.8);font-size:calc(var(--f)*.72);height:calc(var(--f)*var(--hdr));overflow:hidden;
  padding-bottom:calc(var(--f)*var(--hdrPad));border-bottom:2px solid var(--line)}
.marca{font-family:'Playfair Display',Georgia,serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);
  display:flex;align-items:center;gap:.45em;white-space:nowrap;line-height:1.2;min-width:0;overflow:hidden}
.marca svg{width:1.05em;height:1.05em;flex:none}
.marca small{font-family:'Figtree',system-ui,sans-serif;font-weight:700;letter-spacing:.08em;color:var(--soft);font-size:.8em}
/* the warning shrinks its letter to fit (ajustarAviso), never under 0.4 of the names */
#aviso{flex:1;min-width:0;font-size:calc(var(--f)*.66);font-weight:800;line-height:1.08;background:var(--warn);color:var(--warn-ink);
  border-radius:calc(var(--f)*.2);padding:calc(var(--f)*.08) calc(var(--f)*.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#aviso small{display:block;font-size:.79em;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.esp{flex:1}
#pag{display:block;height:1.2em;line-height:1.2;font-weight:800;font-size:calc(var(--f)*.9);font-variant-numeric:tabular-nums;color:var(--soft);white-space:nowrap}

main{flex:1;min-height:0;position:relative;margin-top:calc(var(--f)*var(--mainTop))}
/* a page is a row of explicit columns; each column a stack of category blocks (never a CSS multi-column flow, so a
   block is never cut between columns and a title never lands between another category's items) */
.page,#medida{position:absolute;inset:0;display:flex;align-items:stretch;gap:calc(var(--f)*1.4);overflow:hidden}
.page{opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
.page.on{opacity:1;visibility:visible;transition:opacity .6s ease}
.page.ya{transition:none}                    /* a rebuilt board replaces the old one at once, never through a blank */
#medida{visibility:hidden;pointer-events:none}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:stretch;overflow:hidden}

.cat{flex:none}
.cat h2{margin:0 0 calc(var(--f)*var(--h2mb));font-size:calc(var(--f)*var(--tit));font-weight:800;line-height:1.08;color:var(--cat);
  display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.4em}
.cat h2 .cen{font-size:.5em;font-weight:700;color:var(--soft);letter-spacing:.04em}
.cat h2 .cont{font-size:.5em;font-weight:700;color:var(--soft);letter-spacing:.02em}
.it{padding:calc(var(--f)*var(--padA)) 0 calc(var(--f)*var(--padB))}
.l1{font-size:var(--f);font-weight:700;line-height:var(--lh)}
.pr{font-weight:800;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
.pr .cur{font-size:.8em;margin-right:.04em}
.en{font-size:calc(var(--f)*var(--en));font-weight:500;color:var(--soft);line-height:var(--lh);margin-top:.04em}
.l1 .en{display:inline;margin:0}             /* English in the line (ingles = en-linea): after the name, grey, smaller */
/* sold out, when the TV is set to show it: struck through, a label, never a price */
.it.agotado .es,.it.agotado .en{text-decoration:line-through;text-decoration-thickness:.08em;color:var(--soft)}
.ago{display:inline-block;font-size:.75em;font-weight:800;color:var(--soft);white-space:nowrap;line-height:1.1;
  border:.09em solid currentColor;border-radius:.3em;padding:0 .3em;vertical-align:.08em}

footer{display:flex;align-items:baseline;justify-content:space-between;gap:1em;border-top:2px solid var(--line);
  padding-top:calc(var(--f)*var(--footTop));font-size:calc(var(--f)*.55);color:var(--soft);font-weight:500}

#vacio{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.4em}
#vacio .t1{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:calc(var(--f)*2.2);color:var(--gold)}
#vacio .t2{font-size:calc(var(--f)*1.1);font-weight:700}
#vacio .t3{font-size:calc(var(--f)*.85);color:var(--soft)}

/* === PROMO RENDERER (copied from pantalla-promos.html) · CSS === a slide of the TV over the menu, drawn exactly as
   Screen B draws it (the same classes, colours and letters), with a fade in and out over the menu. #promo plays the
   part of Screen B's stage and layer (.capa): it carries Screen B's colour tokens, so the slide keeps Screen B's look
   whatever the menu's day look (a text-only slide, .claro, turns bright by day as on Screen B). Everything below
   the first rule is Screen B's CSS as it is */
#promo{position:absolute;inset:0;z-index:4;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .8s ease,visibility 0s linear .8s;
  background:var(--deep);color:var(--cream);font-family:'Figtree',system-ui,sans-serif;
  --bg:#0F2418;--deep:#0A1A10;--cream:#F6F1E2;--soft:#C9D3BC;--gold:#DBB365;--leaf:#7FA381;--kick:#A9C9A4;--warn:#F2C14E;--warn-ink:#1B1405;--qr-ink:#0B1A10}
#promo.on{opacity:1;visibility:visible;transition:opacity .8s ease}
#promo.ya,#promo.ya.on{transition:none}      /* a slide that may no longer show (ended, sold out, unverified price) goes at once */
/* the menu's English line (.en, above) must not reach the kicker's English span */
#promo .kick .en{font-size:inherit;font-weight:inherit;line-height:inherit;margin:0;color:var(--soft)}

.sl{position:absolute;inset:0;overflow:hidden;--g:16px}
/* the brand background: no image, so it works without internet */
.fondo{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#1A3A26 0%,var(--bg) 70%)}
.fondo .niebla{position:absolute;inset:-20%;background:
  radial-gradient(45% 30% at 20% 30%,rgba(214,228,214,.10),transparent 70%),
  radial-gradient(50% 32% at 80% 60%,rgba(214,228,214,.08),transparent 70%),
  radial-gradient(40% 26% at 55% 15%,rgba(214,228,214,.07),transparent 70%);
  animation:drift 46s ease-in-out infinite alternate}
.fondo .hojaG{position:absolute;right:-8%;top:-14%;width:58%;height:auto;color:var(--leaf);opacity:.08}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,1.5%,0) scale(1.06)}}
/* a full-bleed photo; while it loads (or if it fails) the brand background shows */
.foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s ease}
.foto.ok{opacity:1;animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.1)}}
.velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,26,16,.5) 0%,rgba(10,26,16,0) 20%,
  rgba(10,26,16,.28) 40%,rgba(10,26,16,.84) 66%,rgba(10,26,16,.95) 100%)}

.sup{position:absolute;display:flex;align-items:center;gap:.45em;font-family:'Playfair Display',Georgia,serif;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--gold);white-space:nowrap;line-height:1.2;
  text-shadow:0 2px 14px rgba(8,16,10,.7)}
.sup svg{width:1.1em;height:1.1em;flex:none}
.caja{position:absolute;display:flex;flex-direction:column}
.txt{margin-top:auto;position:relative;text-shadow:0 2px 18px rgba(8,16,10,.8)}
.confoto .txt::before{content:"";position:absolute;inset:calc(var(--g) * -1.2) calc(var(--g) * -1.6);z-index:-1;pointer-events:none;
  border-radius:calc(var(--g) * 1.5);background:rgba(8,16,10,.5);filter:blur(calc(var(--g) * 1.4))}
.claro .txt{margin:auto 0;text-align:center}

.kick{font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--kick);line-height:1.2;margin-bottom:.5em}
.kick .en{color:var(--soft)}
.tit{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.08;margin:0;color:var(--cream);text-wrap:balance}
.tit-en{font-weight:600;color:var(--soft);line-height:1.15;margin-top:.2em}
.cuerpo{font-weight:600;line-height:1.25;margin-top:.7em;color:var(--cream)}
.cuerpo-en{font-weight:500;line-height:1.25;margin-top:.2em;color:var(--soft)}
.precio{font-weight:800;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:.22em}
.precio .cur{font-size:.8em;margin-right:.05em}
.nota{width:fit-content;max-width:100%;background:var(--warn);color:var(--warn-ink);font-weight:800;line-height:1.2;
  border-radius:.3em;padding:.12em .45em;margin-top:.35em;text-shadow:none}
.pida{font-weight:700;color:var(--soft);line-height:1.2;margin-top:.55em}
.claro .nota{margin-left:auto;margin-right:auto}

/* the built-in brand slide */
.k-propia .hojaM{display:block;margin:0 auto calc(var(--g) * .6);color:var(--gold)}
.k-propia .tit{color:var(--gold);letter-spacing:.02em}
.k-propia .linea{width:22%;height:2px;margin:calc(var(--g) * .9) auto;background:var(--gold);opacity:.55}
.k-propia .lugar{font-weight:600;color:var(--soft);letter-spacing:.06em;line-height:1.2}

/* invitations: the text and the QR code side by side (one above the other on a vertical TV) */
.fila{margin:auto 0;display:flex;align-items:center;gap:calc(var(--g) * 2.2)}
.fila .txt{margin:0;flex:1 1 0;min-width:0;text-align:left}
.vertical .fila{flex-direction:column;align-items:stretch}
.vertical .fila .txt{flex:none;text-align:center}
.qrcol{flex:none;display:flex;flex-direction:column;align-items:center;align-self:center}
.qrcard{background:#fff;border-radius:6px;line-height:0;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.qrcard svg{display:block}
.dir{font-weight:700;color:var(--cream);white-space:nowrap;line-height:1.2;text-align:center;text-shadow:0 2px 12px rgba(8,16,10,.7)}
.qrcard + .dir{margin-top:.45em}
.dirsola{font-weight:800;color:var(--gold);white-space:nowrap;line-height:1.2;text-align:center}

/* daylight look: slides without a photo turn bright (a dark screen mirrors the window); photos keep their dark veil */
#stage.dia .claro{--cream:#0F2618;--soft:#2F3F33;--gold:#7A4A00;--kick:#2F6B3A;--leaf:#2F6B3A}
#stage.dia .claro .fondo{background:#FFFBF1}
#stage.dia .claro .niebla{display:none}
#stage.dia .claro .hojaG{color:#7FA381;opacity:.1}
#stage.dia .claro .txt,#stage.dia .claro .sup,#stage.dia .claro .dir{text-shadow:none}
#stage.dia .claro .qrcard{box-shadow:0 0 0 2px #C9A253}

/* a composition: zones that tile the stage (positioned in px by ajustarComposicion), each with two image layers that
   dissolve into each other: the new one fades in OVER the old one, which stays opaque until the fade ends, so the
   zone is never darker than a photo in between */
.k-composicion .zonas{position:absolute;inset:0}
.zona{position:absolute;overflow:hidden;background:var(--bg)}
.zcapa{position:absolute;inset:0;opacity:0;z-index:1;transition:opacity var(--fundido,1s) ease}
.zcapa.on{opacity:1}
.zcapa.entra{z-index:2}
.zcapa.ya{transition:none}
.zcapa.sale .ztxt{opacity:0}
.zfoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.zvelo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,26,16,0) 42%,rgba(10,26,16,.5) 68%,rgba(10,26,16,.9) 100%)}
.ztxt{position:absolute;left:var(--zp);right:var(--zp);bottom:var(--zp);text-shadow:0 2px 14px rgba(8,16,10,.8);
  transition:opacity var(--fundido,1s) ease}
.ztit{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.08;margin:0;color:var(--cream);text-wrap:balance}
.ztit-en{font-weight:600;color:var(--soft);line-height:1.15;margin-top:.15em}
.zprecio{font-weight:800;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:.18em}
.zprecio .cur{font-size:.8em;margin-right:.05em}
.znota{width:fit-content;max-width:100%;background:var(--warn);color:var(--warn-ink);font-weight:800;line-height:1.2;
  border-radius:.3em;padding:.1em .4em;margin-top:.3em;text-shadow:none}
/* a zone with nothing to show and no fallback photo: the brand design, in the zone */
.zmarca{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:var(--zp);text-shadow:0 2px 14px rgba(8,16,10,.6)}
.zmarca .hojaM{display:block;margin:0 auto calc(var(--zp) * .4);color:var(--gold)}
.zmarca .zmnombre{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.08;color:var(--gold);letter-spacing:.02em;text-wrap:balance}
.zmarca .linea{width:22%;height:2px;margin:calc(var(--zp) * .5) auto;background:var(--gold);opacity:.55}
.zmarca .lugar{font-weight:600;color:var(--soft);letter-spacing:.06em;line-height:1.2}
/* the kicker of a composition: a line in the top right corner, over the zones */
.zkick{position:absolute;z-index:3;background:rgba(8,16,10,.55);border-radius:99px;padding:.3em .9em;margin:0;text-shadow:0 1px 8px rgba(8,16,10,.6)}
.k-composicion .sup{z-index:3}
#stage.dia .zclara{--cream:#0F2618;--soft:#2F3F33;--gold:#7A4A00;--leaf:#2F6B3A}
#stage.dia .zclara .fondo{background:#FFFBF1}
#stage.dia .zclara .niebla{display:none}
#stage.dia .zclara .hojaG{color:#7FA381;opacity:.1}
#stage.dia .zclara .zmarca{text-shadow:none}
/* === end of the PROMO RENDERER (copied from pantalla-promos.html) CSS === */

#diag{position:absolute;right:1%;bottom:1%;z-index:6;max-width:46%;background:rgba(0,0,0,.82);color:#fff;border-radius:8px;
  font:500 calc(var(--f)*.36)/1.35 'Figtree',system-ui,sans-serif;padding:.6em .9em;white-space:pre-wrap}
#diag b{color:#F2C14E}
#fsHint{position:absolute;left:50%;top:1.5%;transform:translateX(-50%);z-index:5;background:rgba(10,26,16,.9);color:#F6F1E2;
  font:700 calc(var(--f)*.5)/1.3 'Figtree',system-ui,sans-serif;padding:.5em 1.2em;border-radius:99px;white-space:nowrap;
  opacity:0;transition:opacity .6s;pointer-events:none}
#fsHint.on{opacity:1}
@media (prefers-reduced-motion:reduce){.page,.page.on,#promo,#promo.on,.foto,.zcapa,.ztxt{transition:none}.foto.ok,.fondo .niebla{animation:none}}
</style>
</head>
<body>
<div id="stage" data-no-translate>
  <header>
    <span class="marca" id="marca"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.6 3.3C9.5 3.6 4.6 9 4.4 15.9c0 1.8.4 3.4 1.2 4.8.5-4 2.3-8.1 5.9-11-2.7 3.5-4.2 7.8-4.3 11.6.7.3 1.5.4 2.3.4 3 0 5.6-1.2 7.4-3.3 2.6-3.1 3-9.6.7-15.1z"/></svg>Hanging Garden Café <small>· Menú · Menu</small></span>
    <span id="aviso" role="status" hidden></span>
    <span class="esp" id="esp"></span>
    <span id="pag"></span>
  </header>
  <main id="main"><div id="medida" aria-hidden="true"></div><div id="vacio" hidden></div></main>
  <footer><span id="nota">Precios en colones, IVA incluido · Prices in colones, tax (IVA) included</span></footer>
  <div id="promo" aria-hidden="true"></div>
  <div id="diag" hidden></div>
  <div id="fsHint">Pulse OK en el control para pantalla completa · Press OK for full screen</div>
</div>

<script src="config.js"></script>
<script src="lang.js"></script>
<script>
/* the screen updates itself after a release (version.js), without a notice to the guests, at any moment */
window.HG_VERSION_NOTICE = function () {};
window.HG_SAFE_TO_RELOAD = function () { return true; };
</script>
<script src="version.js" defer></script>
<script>
(function () {
  'use strict';
  var CFG = window.HG_CONFIG || {};
  var DEMO = window.PANTALLA_DEMO || null;          /* the private demonstration supplies its own menu */
  /* times in ms; only the tests and the demonstration shorten them (window.PANTALLA_TEST). pagina, promoCada and
     promoSeg: 0 = the TV's settings; zona: ms per declared second of a zone's presentation; fundido: the dissolve
     between a zone's photos (as on Screen B) */
  var T = { fresco: 2 * 60000, vencido: 10 * 60000, cada: 30000, revisar: 1000, pagina: 0, copiaMax: 3 * 86400000, limite: 12000, promoCada: 0, promoSeg: 0,
            zona: 1000, fundido: 1000 };
  try {
    var over = window.PANTALLA_TEST || {};
    Object.keys(over).forEach(function (k) { if (k in T && Number(over[k]) > 0) T[k] = Number(over[k]); });
  } catch (e) {}
  var TICK = Math.min(T.cada, T.revisar);
  /* a pause longer than 3 ticks in either clock (sleep, frozen tab, clock moved): prices unverified until a read.
     Never under 3 s, so a busy device with test timings does not count as asleep */
  var SALTO = Math.max(3 * TICK, 3000);
  var SKIP = { 'Extras & Combos': 1 };               /* the till's helpers and the combo line: never on a screen */

  }

  /* ---------- full screen and a screen that stays on (as tv.html) ---------- */
  function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function goFull() {
    if (isFull()) return;
    var de = document.documentElement, fn = de.requestFullscreen || de.webkitRequestFullscreen;
    if (!fn) return;
    try { var p = fn.call(de); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
  addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ' || e.keyCode === 13 || e.keyCode === 23) goFull(); });
  addEventListener('click', goFull);
  var wakeLock = null;
  async function keepAwake() {
    try { if (navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', function () { wakeLock = null; }); } }
    catch (e) { wakeLock = null; }
  }
  function fsHint() {
    var can = document.fullscreenEnabled || document.webkitFullscreenEnabled;
    if (!can || isFull()) return;
    var h = $('fsHint'); h.classList.add('on');
    setTimeout(function () { h.classList.remove('on'); }, 12000);
  }
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) {
    document.addEventListener(ev, function () { $('fsHint').classList.remove('on'); setTimeout(function () { orientar(); pintar(); }, 300); });
  });

  /* ---------- the tick: reads on the monotonic clock; a pause in either clock makes prices unverified ---------- */
  var vivoPerf = 0, vivoReloj = 0;
  function vivo() { vivoPerf = performance.now(); vivoReloj = Date.now(); }
  function tick() {
    var dp = performance.now() - vivoPerf, dr = Date.now() - vivoReloj;
    if (dp > SALTO || Math.abs(dr) > SALTO) { dudar('pausa'); return; }
    if (performance.now() - ultimoIntento >= T.cada - 50) refrescar();
    pintar(); vivo();
  }
  function alVolver() { dudar('vuelta'); keepAwake(); }
  var fuenteT = null;
  function fuentesCargadas() {   /* a web font finished loading: measure the letter again and lay out again */
    clearTimeout(fuenteT);
    fuenteT = setTimeout(function () { proporciones = {}; fuentesN++; pintar(true); }, 60);
  }

  /* ---------- start ---------- */
  window.PANTALLA = {
    info: function () {
      var vig = promoCandidatas(info.estado);
      return JSON.parse(JSON.stringify(Object.assign({}, info, {
        pagina: pagIx, ajustes: AJ, origen: origen, fuente: filaDe || 'direccion', razon: razon, tiempos: T, paginaMs: paginaMs,
        horaCR: hhmm(minutoCR(ahoraMs())), horaDe: srv ? 'servidor' : 'aparato', salto: SALTO, malos: malos, malosBase: malosBase,
        promo: { modo: AJ.promo, cadaMs: promo.cadaMs, segMs: promo.segMs, leidas: promo.datos.length, vigentes: vig.map(function (s) { return s.id; }),
                 enPantalla: promo.actual ? promo.actual.id : null, mostradas: promo.mostradas, composicion: estadoZonas(), medidas: medidas, qr: qrEstado,
                 proximoMs: promo.actual ? null : Math.max(0, Math.round(promo.proximo - performance.now())) }
      })));
    },
    refrescar: refrescar, mostrar: mostrar
  };
  fila = TV_OK ? copiaTv() : null;
  filaDe = fila ? 'copia' : null;
  razon = fila ? null : !TV ? 'sin-tv' : !TV_OK ? 'tv-no-valida' : 'sin-lectura';
  calcularAjustes();
  paginaMs = T.pagina || AJ.pagina * 1000;
  promoArmar();
  orientar();
  var guardado = copia();
  if (guardado) { menu = guardado; deCopia = true; }
  pintar(); vivo();
  refrescar();
  setInterval(tick, TICK);
  armarPaginas();
  addEventListener('resize', function () { orientar(); pintar(); });
  addEventListener('online', function () { refrescar(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) alVolver(); });
  addEventListener('pageshow', function (e) { if (e.persisted) alVolver(); });
  document.addEventListener('resume', alVolver);
  if (document.fonts) {
    if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', fuentesCargadas);
    if (document.fonts.ready) document.fonts.ready.then(fuentesCargadas);
  }
  fsHint(); keepAwake();
})();
</script>
