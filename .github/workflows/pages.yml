name: Publish website

# Publishes the website/ folder to the gh-pages branch, which GitHub Pages serves
# (hanginggardencafe.com once the domain points here).
# The film and photos are not kept in git: they are fetched from the URLs
# listed in website/ASSETS.md at build time.

on:
  push:
    branches: [main, claude/festive-galileo-0twc1p, claude/hanging-garden-coffee-proposal-1m8zd4]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the film and photos listed in website/ASSETS.md
        run: |
          python3 - <<'PY'
          import re, os, urllib.request
          rows = re.findall(r'^\|\s*(assets/[\w.-]+)[^|]*\|\s*(https://\S+?)\s*\|', open('website/ASSETS.md', encoding='utf-8').read(), re.M)
          assert rows, 'no asset rows found in ASSETS.md'
          for path, url in rows:
              dest = os.path.join('website', path)
              if os.path.exists(dest):
                  print('kept', path); continue
              urllib.request.urlretrieve(url, dest)
              print('fetched', path, os.path.getsize(dest), 'bytes')
          PY
      - name: Publish to the gh-pages branch (GitHub Pages serves it)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
          force_orphan: true
          cname: hanginggardencafe.com
          commit_message: 'Publish website'
