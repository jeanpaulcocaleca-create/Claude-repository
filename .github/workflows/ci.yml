name: Tests

# Runs every automated test on each push and pull request. It never publishes anything, holds no secrets
# and never connects to the café's real database: it builds a throw-away copy from the repository.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install PostgreSQL 17 client and age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Install browser test tools
        if: hashFiles('tests/e2e/package.json') != ''
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Lint
        run: bash tests/lint.sh
      - name: SQL tests
        run: bash tests/run-sql.sh
      - name: Backup pipeline
        run: bash tests/backup/test-backup-pipeline.sh
      - name: Browser tests
        if: hashFiles('tests/e2e/run.js') != ''
        run: node tests/e2e/run.js
