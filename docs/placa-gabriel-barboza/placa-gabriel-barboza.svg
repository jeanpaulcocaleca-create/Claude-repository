<text x="150" y="171" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="9.6" fill="#26392C">«Su conocimiento, generosidad y amor</text>
<text x="150" y="184" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="9.6" fill="#26392C">por las orquídeas dejaron una huella</text>
<text x="150" y="197" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="9.6" fill="#26392C">que continúa floreciendo</text>
<text x="150" y="210" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="9.6" fill="#26392C">en este jardín»</text>
